name: Release

on:
  push:
    paths:
      - 'VERSION'
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version" >&2
            exit 1
          fi
          echo "LOKI_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${LOKI_VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create release artifacts
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          mkdir -p release

          # ============================================
          # Artifact 1: loki-mode.zip (for Claude.ai website)
          # SKILL.md at ROOT level for direct upload
          # ============================================
          mkdir -p release/skill-root
          cp SKILL.md release/skill-root/
          cp -r references release/skill-root/

          cd release/skill-root
          zip -r ../loki-mode-${LOKI_VERSION}.zip .
          cd ../..

          # Also create .skill file (same as zip, different extension)
          cp release/loki-mode-${LOKI_VERSION}.zip release/loki-mode-${LOKI_VERSION}.skill

          # ============================================
          # Artifact 2: loki-mode-api.zip (for console.anthropic.com)
          # SKILL.md inside loki-mode/ folder (API requires folder wrapper)
          # ============================================
          mkdir -p release/api-package/loki-mode
          cp SKILL.md release/api-package/loki-mode/
          cp -r references release/api-package/loki-mode/

          cd release/api-package
          zip -r ../loki-mode-api-${LOKI_VERSION}.zip loki-mode
          cd ../..

          # ============================================
          # Artifact 3: loki-mode-claude-code.zip
          # For Claude Code: full package with loki-mode/ folder
          # Extract to ~/.claude/skills/
          # ============================================
          mkdir -p release/loki-mode
          cp SKILL.md release/loki-mode/
          cp README.md release/loki-mode/
          cp LICENSE release/loki-mode/ 2>/dev/null || true
          cp VERSION release/loki-mode/
          cp CHANGELOG.md release/loki-mode/
          cp -r references release/loki-mode/
          cp -r examples release/loki-mode/
          cp -r tests release/loki-mode/
          cp -r scripts release/loki-mode/
          cp -r autonomy release/loki-mode/

          cd release
          zip -r loki-mode-claude-code-${LOKI_VERSION}.zip loki-mode
          tar -czvf loki-mode-claude-code-${LOKI_VERSION}.tar.gz loki-mode
          cd ..

      - name: Create Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${LOKI_VERSION}" -m "Release v${LOKI_VERSION}"
          git push origin "v${LOKI_VERSION}"

      - name: Extract changelog for this version
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${LOKI_VERSION}"
          CHANGELOG=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="Release v$VERSION"
          fi
          echo "$CHANGELOG" > changelog_body.txt

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${LOKI_VERSION}" \
            release/loki-mode-${LOKI_VERSION}.zip \
            release/loki-mode-${LOKI_VERSION}.skill \
            release/loki-mode-api-${LOKI_VERSION}.zip \
            release/loki-mode-claude-code-${LOKI_VERSION}.zip \
            release/loki-mode-claude-code-${LOKI_VERSION}.tar.gz \
            --title "Loki Mode v${LOKI_VERSION}" \
            --notes-file changelog_body.txt

      - name: Skip message
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "Tag v${LOKI_VERSION} already exists. Skipping release."
