name: Distribution candidate

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distribution-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable protected candidate
        shell: bash
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "${GITHUB_REF_TYPE}" = tag
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.10'
      - name: Install verifier dependencies
        run: |
          npm ci --ignore-scripts
          pip install -r tools/requirements.txt
      - name: Verify prepared distribution
        run: |
          npm run distribution:verify
          npm run sync:release-state
          npm run validate:strict
          npm run validate:glossary
          npm run validate:references
          npm run security:scan:strict
          npm run plugin-compat:check
          npm run bundles:check
          npm audit --audit-level=high
          npm run security:docs
          git diff --exit-code
      - name: Pack the runtime candidate once
        run: |
          mkdir -p "$RUNNER_TEMP/distribution"
          node tools/scripts/distribution_pack.cjs "$RUNNER_TEMP/distribution"
      - name: Run complete suite against candidate bytes
        env:
          AAS_TEST_CANDIDATE_TARBALL: ${{ runner.temp }}/distribution/package.tgz
        run: npm run test
      - name: Build and test public site once
        env:
          VITE_BASE_PATH: /
          SEO_SITE_URL: https://aaskills.tech
        run: |
          npm run app:install
          npm run app:test:coverage
          npm run app:build
          npm --prefix apps/web-app audit --audit-level=high
          npm --prefix apps/web-app run verify:seo -- --require-hosted-url
      - name: Pack immutable publication bytes
        shell: bash
        run: |
          cp apps/web-app/dist/index.html apps/web-app/dist/404.html
          touch apps/web-app/dist/.nojekyll
          tar -cf "$RUNNER_TEMP/distribution/site.tar" -C apps/web-app/dist .
          node tools/scripts/distribution_manifest.cjs create "$RUNNER_TEMP/distribution" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-candidate
          path: ${{ runner.temp }}/distribution/*
          if-no-files-found: error
          retention-days: 30

  functional:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.23.1', job-id: linux-node-22 }
          - { os: ubuntu-24.04, node: '24', job-id: linux-node-24 }
          - { os: windows-2025, node: '22.23.1', job-id: windows-node-22 }
          - { os: windows-2025, node: '24', job-id: windows-node-24 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-candidate
          path: ${{ runner.temp }}/distribution
      - name: Verify candidate bytes and identity
        run: node tools/scripts/distribution_manifest.cjs verify "${{ runner.temp }}/distribution" "${{ github.run_id }}" "${{ github.run_attempt }}"
      - name: Install and exercise exact packed product
        run: node verification/aas-preview/run-installed-candidate.mjs --artifact-root "${{ runner.temp }}/distribution" --install-root "${{ runner.temp }}/candidate-install" --work-root "${{ runner.temp }}/candidate-work" --job-id "${{ matrix.job-id }}" --out "${{ runner.temp }}/functional.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: functional-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/functional.json
          if-no-files-found: error
