# Publish the tested bytes for an immutable AAS release tag.
# Requires NPM_TOKEN secret (npm → Access Tokens → Granular token with Publish).

name: Publish to npm
run-name: Publish npm ${{ inputs.tag }} at ${{ inputs.commit }}

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable release tag
        required: true
        type: string
      commit:
        description: Full release commit SHA
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-npm-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: main
          fetch-depth: 0

      - name: Verify protected release provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$RELEASE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          git fetch --force origin main "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-list -n1 "$RELEASE_TAG")"
          test "$tag_commit" = "$RELEASE_COMMIT"
          main_commit="$(git rev-parse origin/main)"
          git merge-base --is-ancestor "$tag_commit" "$main_commit"
          tag_version="$(git show "$RELEASE_TAG:package.json" | node -e 'let s=""; process.stdin.on("data",c=>s+=c); process.stdin.on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$RELEASE_TAG" = "v$tag_version"
          node tools/scripts/release_cycle_gate.cjs "$tag_version" "$tag_commit"
          git checkout --detach "$tag_commit"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Fetch and verify tested immutable candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/scripts/distribution_fetch.cjs "$RUNNER_TEMP/distribution"

      - name: Publish exact candidate and verify registry bytes
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: |
          version="$(node -p "require('./package.json').version")"
          node -e "const v=process.argv[1]; const semver=/^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(?:\\.[0-9A-Za-z-]+)*)?$/; if (!semver.test(v)) process.exit(1)" "$version"
          candidate="$RUNNER_TEMP/distribution/package.tgz"
          if npm view "agentic-awesome-skills@$version" version --json --cache "$NPM_CONFIG_CACHE" >/dev/null 2>&1; then
            node tools/scripts/verify_npm_candidate.cjs "$version" "$RELEASE_COMMIT" "$candidate"
          else
            if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
            npm publish "$candidate" --ignore-scripts --tag "$tag"
            node tools/scripts/verify_npm_candidate.cjs "$version" "$RELEASE_COMMIT" "$candidate" --wait-until-published
          fi
