name: SkillSpector Advisory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: read

concurrency:
  group: skillspector-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evidence-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for exact-head PR evidence
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          fail() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; }
          for attempt in $(seq 1 60); do
            # Select the newest eligible CI run BEFORE selecting its evidence job.
            # Metadata emits the same check name but is not scanner provenance.
            runs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=pull_request&per_page=100")
            run=$(printf '%s' "$runs" | jq -c --arg sha "$PR_HEAD" \
              --arg repo "$PR_HEAD_REPO" --arg branch "$PR_HEAD_BRANCH" --arg upstream "$GITHUB_REPOSITORY" \
              '[.[].workflow_runs[] | select(.event == "pull_request" and .path == ".github/workflows/ci.yml" and
                .head_sha == $sha and .head_repository.full_name == $repo and
                .head_branch == $branch and .repository.full_name == $upstream)] | sort_by(.id) | last')
            if [ "$run" != "null" ]; then
              run_id=$(printf '%s' "$run" | jq -er '.id')
              run_attempt=$(printf '%s' "$run" | jq -er '.run_attempt')
              jobs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/attempts/$run_attempt/jobs?per_page=100")
              count=$(printf '%s' "$jobs" | jq '[.[].jobs[] | select(.name == "pr-evidence")] | length')
              [ "$count" -le 1 ] || fail "Ambiguous PR evidence jobs."
              job=$(printf '%s' "$jobs" | jq -c '[.[].jobs[] | select(.name == "pr-evidence")] | first')
              if [ "$job" != "null" ]; then
                printf '%s' "$job" | jq -e --arg sha "$PR_HEAD" --argjson run "$run_id" --argjson attempt "$run_attempt" \
                  '.head_sha == $sha and .run_id == $run and .run_attempt == $attempt' >/dev/null || fail "PR evidence job provenance mismatch."
                if [ "$(printf '%s' "$job" | jq -r '.status')" = "completed" ]; then
                  [ "$(printf '%s' "$job" | jq -r '.conclusion')" = "success" ] || fail "PR evidence did not pass; no scan ran."
                  job_id=$(printf '%s' "$job" | jq -er '.id')
                  check=$(gh api "repos/$GITHUB_REPOSITORY/check-runs/$job_id")
                  printf '%s' "$check" | jq -e --arg sha "$PR_HEAD" --argjson id "$job_id" \
                    '.id == $id and .app.id == 15368 and .name == "pr-evidence" and .head_sha == $sha and
                     .status == "completed" and .conclusion == "success"' >/dev/null || fail "PR evidence check identity mismatch."
                  pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
                  printf '%s' "$pr" | jq -e --arg sha "$PR_HEAD" --arg repo "$PR_HEAD_REPO" \
                    --arg branch "$PR_HEAD_BRANCH" --arg upstream "$GITHUB_REPOSITORY" --arg number "$PR_NUMBER" \
                    '.number == ($number | tonumber) and .state == "open" and .head.sha == $sha and
                     .head.repo.full_name == $repo and .head.ref == $branch and .base.repo.full_name == $upstream' >/dev/null || fail "The PR changed while waiting."
                  latest=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")
                  [ "$(printf '%s' "$latest" | jq -r '.run_attempt')" = "$run_attempt" ] || fail "CI was rerun while reading evidence."
                  # Recheck selection after collecting evidence; a newer CI run cannot be hidden by old green jobs.
                  runs=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$PR_HEAD&event=pull_request&per_page=100")
                  newest=$(printf '%s' "$runs" | jq -r --arg sha "$PR_HEAD" --arg repo "$PR_HEAD_REPO" \
                    --arg branch "$PR_HEAD_BRANCH" --arg upstream "$GITHUB_REPOSITORY" \
                    '[.[].workflow_runs[] | select(.event == "pull_request" and .path == ".github/workflows/ci.yml" and
                      .head_sha == $sha and .head_repository.full_name == $repo and .head_branch == $branch and
                      .repository.full_name == $upstream)] | sort_by(.id) | last | .id')
                  [ "$newest" = "$run_id" ] || fail "CI selection changed while reading evidence."
                  echo "Exact-head pr-evidence passed; advisory scanning may start." | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
              fi
            fi
            echo "Waiting for exact-head CI evidence ($attempt/60)."
            sleep 10
          done
          fail "Timed out waiting for exact-head PR evidence; no scan ran."

  skillspector-advisory:
    needs: evidence-ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check out trusted base tooling
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Detect advisory tooling
        id: tooling
        run: |
          if [ -f tools/scripts/skillspector_advisory.py ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "SkillSpector bootstrap: trusted base does not yet contain the scanner wrapper." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fetch immutable PR head
        if: steps.tooling.outputs.available == 'true'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: git fetch origin "$PR_HEAD"
      - name: Plan changed canonical skill directories
        id: plan
        if: steps.tooling.outputs.available == 'true'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/scripts/skillspector_advisory.py \
            --base "$PR_BASE" --head "$PR_HEAD" \
            --output "$PWD/.tmp/skillspector-advisory"
          python3 -c 'import json; p=json.load(open(".tmp/skillspector-advisory/manifest.json")); print("count=" + str(len(p["skills"])))' >> "$GITHUB_OUTPUT"
      - name: Check out pinned SkillSpector
        if: steps.tooling.outputs.available == 'true' && steps.plan.outputs.count != '0'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          repository: NVIDIA/SkillSpector
          ref: c7958a3268d9498644b22edb75d0f051bbc8cbfc # v2.12.0
          path: .tmp/skillspector-upstream
          persist-credentials: false
      - name: Set up Python
        if: steps.tooling.outputs.available == 'true' && steps.plan.outputs.count != '0'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked scanner dependencies
        if: steps.tooling.outputs.available == 'true' && steps.plan.outputs.count != '0'
        run: |
          python -m pip install uv==0.8.22
          uv sync --frozen --no-dev --project .tmp/skillspector-upstream
      - name: Scan inert skill snapshots without network
        if: steps.tooling.outputs.available == 'true' && steps.plan.outputs.count != '0'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .tmp/skillspector-advisory
          sudo --preserve-env=GITHUB_STEP_SUMMARY unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- \
            "$(command -v python)" tools/scripts/skillspector_advisory.py \
            --base "$PR_BASE" --head "$PR_HEAD" \
            --output "$PWD/.tmp/skillspector-advisory" \
            --scanner "$PWD/.tmp/skillspector-upstream/.venv/bin/skillspector"
      - name: Upload static advisory reports
        if: always() && steps.tooling.outputs.available == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skillspector-advisory-${{ github.event.pull_request.number }}
          path: .tmp/skillspector-advisory/
          if-no-files-found: warn
          retention-days: 14
