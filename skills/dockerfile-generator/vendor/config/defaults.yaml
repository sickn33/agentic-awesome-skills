# Docker File Generator global defaults
# Generated from docker_file_generator/registry.py.
# Edit project overrides in dockerfile.yaml; do not edit this file casually.
schema:
  version: 1
defaults:

  # Fallback application port when detection finds no stronger signal.
  # affects: EXPOSE, healthcheck, runtime command
  port: 8080

  # Fallback health endpoint path.
  # affects: HEALTHCHECK
  health: '/health'

  # Default healthcheck start period.
  # affects: HEALTHCHECK
  health_start: '10s'

  # Optional container stop signal.
  # affects: STOPSIGNAL
  stopsignal: ''

  # Host address used for published application ports.
  # affects: compose.yaml ports
  # allowed: 127.0.0.1, 0.0.0.0, ::1, ::
  compose_bind: '127.0.0.1'
images:

  # Alpine base image version.
  # affects: FROM
  # allowed: 3.24.1
  alpine: '3.24.1'

  # Rust builder image version.
  # affects: FROM, Cargo build
  rust: '1.89-alpine'

  # Default Python base image.
  # affects: FROM
  python: 'python:3.12.4-alpine'

  # Default Node.js base image.
  # affects: FROM
  node: 'node:20-alpine'

  # Default Ruby base image.
  # affects: FROM
  ruby: 'ruby:3.2-alpine'

  # Default Elixir base image.
  # affects: FROM
  elixir: 'elixir:1.15-alpine'

  # Default PHP-FPM base image.
  # affects: FROM
  php: 'php:8.2-fpm-alpine'

  # Default Swift toolchain image.
  # affects: FROM
  swift: 'swift:5.10-amazonlinux2'

  # Default Haskell toolchain image.
  # affects: FROM
  haskell: 'haskell:9.4'

  # SPA nginx runtime image.
  # affects: FROM
  nginx: 'nginx:1.30-alpine'

  # Deno runtime image.
  # affects: FROM
  deno: 'denoland/deno:alpine'

  # Scala SBT builder image.
  # affects: FROM
  sbt: 'eclipse-temurin:11-jdk'

  # Maven builder image.
  # affects: FROM
  maven: 'maven:3.9-eclipse-temurin-21'

  # Gradle builder image.
  # affects: FROM
  gradle: 'gradle:8.5-jdk21'

  # Conda Python image.
  # affects: FROM
  conda: 'continuumio/miniconda3:24.11.1-0'

  # Clojure Lein image.
  # affects: FROM
  clojure_lein: 'clojure:tools-deps:1.11.1.1435-jdk-21'

  # Clojure tools.deps image.
  # affects: FROM
  clojure_tools_deps: 'clojure:temurin-21-tools-deps'

  # .NET major SDK/runtime version.
  # affects: FROM
  dotnet_major: 8

  # Java major version.
  # affects: FROM, healthcheck
  java_major: 21

  # Gradle version used when no wrapper exists.
  # affects: FROM
  gradle_version: '8.5'
escape_hatches:

  # Allowlisted extra COPY instructions.
  # affects: Dockerfile
  copy: ''

  # Allowlisted extra RUN instructions.
  # affects: Dockerfile
  run: ''

  # Allowlisted extra top-level Dockerfile directives.
  # affects: Dockerfile
  directives: ''
release_assets:

  # Optional Dockerfile-2 asset URL template.
  # affects: Dockerfile-2
  asset_url: ''

  # Optional Dockerfile-2 checksum URL template.
  # affects: Dockerfile-2
  asset_sha_url: ''

  # Default release selector for generated Dockerfile-2.
  # affects: Dockerfile-2
  # allowed: latest
  default_release: 'latest'
languages:
  python:

    # Fallback Python application port.
    # affects: EXPOSE, uvicorn command
    default_port: 8000
  go:

    # Fallback Go application port.
    # affects: EXPOSE
    default_port: 8080
  node:

    # Fallback Node.js application port.
    # affects: EXPOSE, runtime command
    default_port: 3000
  rust:

    # Fallback Rust application port.
    # affects: EXPOSE
    default_port: 8000
  java:

    # Fallback Java application port.
    # affects: EXPOSE, runtime command
    default_port: 8080
  kotlin:

    # Fallback Kotlin application port.
    # affects: EXPOSE, runtime command
    default_port: 8080
  ruby:

    # Fallback Ruby application port.
    # affects: EXPOSE, runtime command
    default_port: 8080
  csharp:

    # Fallback .NET application port.
    # affects: EXPOSE, ASPNETCORE_URLS
    default_port: 5000
  php:

    # Fallback PHP application port.
    # affects: EXPOSE, nginx listen
    default_port: 8000
  swift:

    # Fallback Swift application port.
    # affects: EXPOSE
    default_port: 8080
  scala:

    # Fallback Scala application port.
    # affects: EXPOSE
    default_port: 9000
  elixir:

    # Fallback Elixir application port.
    # affects: EXPOSE
    default_port: 4000
  clojure:

    # Fallback Clojure application port.
    # affects: EXPOSE
    default_port: 9000
  haskell:

    # Fallback Haskell application port.
    # affects: EXPOSE
    default_port: 8080
  spa:

    # Fallback SPA development server port.
    # affects: EXPOSE
    default_port: 3000
frameworks:
  fastify:

    # Explicit Fastify start command.
    # affects: CMD
    # allowed: npm start
    start: 'npm start'
  spring:

    # Spring health endpoint candidates.
    # affects: HEALTHCHECK, HEALTH_PATH
    health_paths: '/actuator/health/liveness,/actuator/health'
  rails:

    # Rails public document root.
    # affects: nginx root
    docroot: 'public'
  laravel:

    # Laravel public document root.
    # affects: nginx root
    docroot: 'public'
