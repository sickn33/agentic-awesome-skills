<!DOCTYPE html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="lib/kit/kit.css">
    <style>
      /* fonts:begin */
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/noto-sans-sc-700.woff2") format("woff2"); font-weight: 700; font-style: normal; font-display: block; }
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: block; }
@font-face { font-family: "Bangers"; src: url("assets/fonts/bangers.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
/* fonts:end */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #fff6e0; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--kit-bg); color: var(--kit-ink);
        font-family: var(--kit-font-body); font-weight: 900; }
      #stage { position: absolute; inset: 0; overflow: hidden; background: var(--kit-bg); }
      #shake { position: absolute; inset: 0; }
      #bg { overflow: hidden; background: var(--kit-bg); }
      #bg .kit-dots { opacity: 0; }
      #view { position: absolute; inset: 0; clip-path: inset(30px 40px 42px 32px); }
      #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
      .scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: none; }
      .scene > * { position: absolute; left: 0; top: 0; }
      #hud { position: absolute; inset: 0; }
      #hud > * { left: 0; top: 0; }
      .full { width: 1920px; height: 1080px; overflow: visible; }
      .a { position: absolute; left: 0; top: 0; }

      /* tokens: lettered tiles; the newest is pink and grows eyes */
      .tok { height: 116px; display: flex; align-items: center; justify-content: center; background: #ffffff; border: 6px solid var(--kit-ink);
        border-radius: 12px; box-shadow: 7px 7px 0 var(--kit-ink); font-size: 64px; line-height: 1; white-space: nowrap; color: var(--kit-ink); }
      .tok.sm { height: 96px; font-size: 52px; border-radius: 10px; }
      .tok.new { background: var(--kit-accent); }
      .tok.lit { background: var(--kit-yellow); }
      .tok.dim { background: #ece3cf; color: #5e5850; border-color: #5e5850; box-shadow: 5px 5px 0 #5e5850; }
      .eyes { position: absolute; left: 50%; top: -44px; display: flex; gap: 6px; transform: translateX(-50%); visibility: hidden; }
      .eye { position: relative; display: block; width: 46px; height: 46px; border-radius: 50%; background: #ffffff; border: 6px solid var(--kit-ink); }
      .eye i { position: absolute; left: 9px; top: 9px; width: 16px; height: 16px; border-radius: 50%; background: var(--kit-ink); }
      .tok.sm .eyes { top: -26px; gap: 4px; }
      .tok.sm .eye { width: 38px; height: 38px; border-width: 5px; }
      .tok.sm .eye i { left: 7px; top: 7px; width: 14px; height: 14px; }
      .slotd { height: 116px; border: 6px dashed #9a9184; border-radius: 12px; display: flex; align-items: center; justify-content: center;
        font-family: var(--kit-font-display); font-weight: 400; font-size: 64px; line-height: 1; color: #5e5850; }

      /* the model */
      .mach { width: 400px; height: 520px; }
      .mach-body { position: absolute; left: 0; top: 60px; width: 400px; height: 460px; border: 8px solid var(--kit-ink); border-radius: 28px;
        box-shadow: 12px 12px 0 var(--kit-ink); }
      .mach-plate { position: absolute; left: 50%; top: 26px; transform: translateX(-50%) rotate(-2deg); padding: 4px 26px 8px; background: var(--kit-yellow);
        border: 6px solid var(--kit-ink); box-shadow: 6px 6px 0 var(--kit-ink); font-size: 54px; line-height: 1.2; white-space: nowrap; }
      .mach-eye { position: absolute; top: 150px; width: 92px; height: 92px; border-radius: 50%; background: #ffffff; border: 7px solid var(--kit-ink); }
      .mach-eye i { position: absolute; left: 24px; top: 24px; width: 30px; height: 30px; border-radius: 50%; background: var(--kit-ink); }
      .mach-mouth { position: absolute; left: 90px; top: 290px; width: 220px; height: 34px; border-radius: 18px; background: var(--kit-ink); }
      .mach-ant { position: absolute; left: 192px; top: 4px; width: 16px; height: 62px; background: var(--kit-ink); }
      .mach-ant i { position: absolute; left: -17px; top: -26px; width: 50px; height: 50px; border-radius: 50%; background: var(--kit-accent); border: 6px solid var(--kit-ink); }

      .ask { width: 760px; height: 234px; }
      .ask svg { position: absolute; left: 0; top: 0; width: 760px; height: 234px; overflow: visible; transform: scaleY(-1); }
      .ask-t { position: absolute; left: 0; top: 76px; width: 750px; height: 150px; display: flex; align-items: center; justify-content: center; font-size: 60px; white-space: nowrap; }

      .cell { width: 108px; height: 50px; border: 5px solid var(--kit-ink); border-radius: 6px; background: #ffffff; box-shadow: 4px 4px 0 var(--kit-ink); }
      .cell.new { background: var(--kit-accent); }
      .cell.redo { background: repeating-linear-gradient(-45deg, var(--kit-warn) 0 9px, #ffab96 9px 17px); }
      .rowlab { font-size: 30px; font-weight: 700; line-height: 1; white-space: nowrap; }
      .legend { display: flex; align-items: center; gap: 14px; font-size: 32px; line-height: 1.2; white-space: nowrap; }
      .legend i { display: block; width: 58px; height: 36px; border: 5px solid var(--kit-ink); border-radius: 5px; box-shadow: 3px 3px 0 var(--kit-ink); }
      .badge-bi { width: 60px; height: 60px; border-radius: 50%; background: var(--kit-yellow); border: 5px solid var(--kit-ink); box-shadow: 4px 4px 0 var(--kit-ink);
        display: flex; align-items: center; justify-content: center; font-size: 32px; line-height: 1; }

      /* the cache cabinet */
      .cab { width: 600px; height: 730px; background: #ffffff; border: 8px solid var(--kit-ink); box-shadow: 12px 12px 0 var(--kit-ink); }
      .cab-h { position: absolute; left: 0; right: 0; top: 0; height: 74px; background: var(--kit-ink); color: #ffffff; display: flex; align-items: center;
        padding: 0 24px; font-family: var(--kit-font-display); font-weight: 400; font-size: 56px; letter-spacing: 0.04em; line-height: 1; }
      .cab-col { position: absolute; top: 82px; height: 50px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 5px solid var(--kit-ink);
        font-size: 30px; line-height: 1; white-space: nowrap; }
      .cab-col b { font-family: var(--kit-font-display); font-weight: 400; font-size: 40px; }
      .slot { width: 240px; height: 84px; border: 5px dashed #9a9184; border-radius: 8px; }
      .slot.full { border-style: solid; border-color: var(--kit-ink); background: #fff3b0; }
      .slot.vfull { border-style: solid; border-color: var(--kit-ink); background: #d4e7f8; }
      .wbar { height: 26px; border: 4px solid var(--kit-ink); background: repeating-linear-gradient(-45deg, var(--kit-accent) 0 9px, #ff9fcd 9px 17px);
        transform-origin: 0 50%; }
      .ktag, .vcard { width: 100px; height: 76px; display: flex; align-items: center; justify-content: center; border: 5px solid var(--kit-ink);
        box-shadow: 5px 5px 0 var(--kit-ink); font-family: var(--kit-font-display); font-weight: 400; font-size: 56px; line-height: 1; }
      .ktag { background: var(--kit-yellow); border-radius: 8px 30px 30px 8px; justify-content: flex-start; padding: 4px 0 0 18px; }
      .ktag::after { content: ""; position: absolute; right: 12px; top: 26px; width: 14px; height: 14px; border-radius: 50%; border: 4px solid var(--kit-ink); background: #ffffff; }
      .vcard { background: var(--kit-accent-2); color: #ffffff; border-radius: 8px; }
      .qglass { width: 110px; height: 110px; }
      .qglass .ring { position: absolute; left: 0; top: 0; width: 92px; height: 92px; border-radius: 50%; background: var(--kit-accent); border: 7px solid var(--kit-ink);
        box-shadow: 5px 5px 0 var(--kit-ink); display: flex; align-items: center; justify-content: center; font-family: var(--kit-font-display); font-weight: 400;
        font-size: 56px; line-height: 1; padding-top: 4px; }
      .qglass .hdl { position: absolute; left: 76px; top: 70px; width: 22px; height: 52px; background: var(--kit-ink); border-radius: 8px; transform: rotate(-45deg); transform-origin: 50% 0; }
      .stamp1 { width: 300px; height: 240px; }
      .stamp1 .kit-burst { left: 0; top: 0; }
      .stamp1-t { position: absolute; left: 0; right: 0; top: 44px; text-align: center; font-family: var(--kit-font-display); font-weight: 400; font-size: 92px; line-height: 1;
        color: var(--kit-accent); -webkit-text-stroke: 12px var(--kit-ink); paint-order: stroke fill; text-shadow: 5px 5px 0 var(--kit-ink); }
      .stamp1-s { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font-size: 32px; line-height: 1.2; }

      /* 显存 tank + chart */
      .tank { width: 340px; height: 720px; background: #ffffff; border: 8px solid var(--kit-ink); border-radius: 18px; box-shadow: 12px 12px 0 var(--kit-ink); overflow: hidden; }
      .tank-h { position: absolute; left: 0; right: 0; top: 0; height: 82px; background: var(--kit-ink); color: #ffffff; display: flex; align-items: center; justify-content: center;
        font-size: 54px; line-height: 1; }
      .tank-tick { position: absolute; left: 0; width: 26px; height: 5px; background: var(--kit-ink); }
      .slab { width: 284px; height: 114px; border: 6px solid var(--kit-ink); border-radius: 8px; display: flex; align-items: center; justify-content: center;
        background: repeating-linear-gradient(-45deg, var(--kit-accent) 0 13px, #ff9fcd 13px 24px); font-family: var(--kit-font-display); font-weight: 400;
        font-size: 50px; line-height: 1; color: var(--kit-ink); }
      .slab span { background: #ffffff; border: 4px solid var(--kit-ink); padding: 4px 12px 0; }
      .tick-l { font-family: var(--kit-font-display); font-weight: 400; font-size: 44px; line-height: 1; white-space: nowrap; }
      .axis-t { font-size: 32px; font-weight: 700; line-height: 1.2; white-space: nowrap; }
      .bracket-t { padding: 6px 20px 2px; background: var(--kit-accent); border: 6px solid var(--kit-ink); box-shadow: 7px 7px 0 var(--kit-ink);
        font-family: var(--kit-font-display); font-weight: 400; font-size: 64px; line-height: 1; white-space: nowrap; }

      /* the three fixes */
      .pnl { width: 570px; height: 800px; }
      .pnl-h { position: absolute; left: 0; right: 0; top: 0; height: 104px; background: var(--kit-yellow); border-bottom: 6px solid var(--kit-ink); display: flex;
        align-items: center; gap: 16px; padding: 0 22px; white-space: nowrap; }
      .pnl-h .big { font-family: var(--kit-font-display); font-weight: 400; font-size: 66px; line-height: 1; padding-top: 6px; letter-spacing: 0.03em; }
      .pnl-h .big.cjk { font-family: var(--kit-font-body); font-weight: 900; font-size: 58px; padding-top: 0; letter-spacing: 0; }
      .pnl-h .chip { padding: 2px 14px 4px; background: var(--kit-ink); color: #ffffff; font-size: 32px; line-height: 1.25; }
      .pnl-n { position: absolute; right: 18px; top: 18px; width: 58px; height: 58px; border-radius: 50%; background: var(--kit-ink); color: #ffffff;
        display: flex; align-items: center; justify-content: center; font-family: var(--kit-font-display); font-weight: 400; font-size: 38px; padding-top: 4px; }
      .qh { width: 92px; height: 64px; display: flex; align-items: center; justify-content: center; background: var(--kit-accent); border: 5px solid var(--kit-ink);
        border-radius: 8px; box-shadow: 4px 4px 0 var(--kit-ink); font-family: var(--kit-font-display); font-weight: 400; font-size: 40px; line-height: 1; padding-top: 4px; }
      .mk, .mv { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; border: 5px solid var(--kit-ink); box-shadow: 4px 4px 0 var(--kit-ink);
        font-family: var(--kit-font-display); font-weight: 400; font-size: 36px; line-height: 1; padding-top: 3px; }
      .mk { background: var(--kit-yellow); border-radius: 6px 20px 20px 6px; }
      .mv { background: var(--kit-accent-2); color: #ffffff; border-radius: 6px; }
      .cbar-l { font-size: 30px; line-height: 1.2; white-space: nowrap; }
      .cbar { width: 500px; height: 46px; border: 5px solid var(--kit-ink); background: #ffffff; box-shadow: 5px 5px 0 var(--kit-ink); overflow: hidden; }
      .cbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; border-right: 4px solid var(--kit-ink);
        background: repeating-linear-gradient(-45deg, var(--kit-accent) 0 12px, #ff9fcd 12px 22px); }
      .cbar i.waste { background: repeating-linear-gradient(-45deg, var(--kit-warn) 0 12px, #ffab96 12px 22px); }
      .page { width: 112px; height: 86px; border: 5px dashed #9a9184; border-radius: 6px; display: flex; align-items: center; justify-content: center;
        font-size: 30px; line-height: 1; color: #5e5850; }
      .page.full { border-style: solid; border-color: var(--kit-ink); background: var(--kit-accent); color: var(--kit-ink); box-shadow: 4px 4px 0 var(--kit-ink); }
      .resv { width: 500px; height: 86px; border: 5px solid var(--kit-ink); box-shadow: 5px 5px 0 var(--kit-ink); overflow: hidden;
        background: repeating-linear-gradient(-45deg, #ffd6cc 0 12px, #fff 12px 22px); }
      .resv i { position: absolute; left: 0; top: 0; bottom: 0; width: 150px; background: var(--kit-accent); border-right: 5px solid var(--kit-ink); }
      .resv span { position: absolute; left: 170px; top: 0; bottom: 0; display: flex; align-items: center; font-size: 30px; color: var(--kit-ink); }
      .bits { height: 80px; border: 5px solid var(--kit-ink); border-radius: 6px; box-shadow: 4px 4px 0 var(--kit-ink); overflow: hidden;
        background: repeating-linear-gradient(90deg, var(--kit-yellow) 0 6px, #ffffff 6px 12px); }
      .bits.v { background: repeating-linear-gradient(90deg, #8cc0ee 0 6px, #ffffff 6px 12px); }
      .rowk { font-family: var(--kit-font-display); font-weight: 400; font-size: 52px; line-height: 1; }
      .jaw { width: 34px; height: 300px; background: var(--kit-ink); border-radius: 6px; }
      .fmt { display: flex; align-items: center; gap: 12px; font-family: var(--kit-font-display); font-weight: 400; font-size: 52px; line-height: 1; white-space: nowrap; }
      .fmt b { font-weight: 400; padding: 4px 14px 0; border: 5px solid var(--kit-ink); background: #ffffff; }
      .fmt b.to { background: var(--kit-accent); }

      /* balance */
      .beam { width: 640px; height: 26px; background: var(--kit-ink); border-radius: 13px; }
      .pole { width: 30px; height: 520px; background: var(--kit-ink); }
      .basep { width: 320px; height: 50px; background: var(--kit-ink); border-radius: 12px 12px 4px 4px; }
      .pan { width: 240px; height: 40px; background: var(--kit-yellow); border: 6px solid var(--kit-ink); border-radius: 0 0 120px 120px; box-shadow: 5px 5px 0 var(--kit-ink); }
      .vblock { width: 190px; height: 140px; border: 7px solid var(--kit-ink); border-radius: 12px; box-shadow: 6px 6px 0 var(--kit-ink);
        background: repeating-linear-gradient(-45deg, var(--kit-accent) 0 13px, #ff9fcd 13px 24px); display: flex; align-items: center; justify-content: center; }
      .vblock span { background: #ffffff; border: 4px solid var(--kit-ink); padding: 2px 12px 4px; font-size: 40px; line-height: 1.2; }
      .bolt { width: 200px; height: 180px; }
      .bolt-t { position: absolute; left: 50%; top: 58px; transform: translateX(-50%); background: #ffffff; border: 4px solid var(--kit-ink); padding: 2px 12px 4px;
        font-size: 40px; line-height: 1.2; white-space: nowrap; }
      .swap { width: 200px; height: 110px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="stage" class="clip" data-start="0" data-duration="45" data-track-index="1">
        <div id="shake">
          <div id="bg" class="kit-page">
            <div class="kit-dots kit-dots-pink"></div>
            <div class="kit-dots kit-dots-blue"></div>
            <div class="kit-dots kit-dots-yellow"></div>
            <div class="kit-dots kit-dots-pink"></div>
            <div class="kit-dots kit-dots-blue"></div>
          </div>
          <div id="view">
            <svg id="rays" class="kit-rays"></svg>
            <div id="world" data-layout-allow-overflow=""></div>
          </div>
          <div class="kit-page kit-page-frame"></div>
          <div id="hud"></div>
        </div>
      </div>

      <!-- chapter chip (core.Chapters, styled by the kit) -->
      <div id="chap" class="clip" data-start="0" data-duration="45" data-track-index="2"></div>

      <!-- the one-frame recap (Kit.recap) -->
      <div id="recap-layer" class="clip" data-start="0" data-duration="45" data-track-index="5" style="position: absolute; inset: 0"></div>

      <!-- halftone dot wipe at every chapter seam -->
      <div id="wipe-layer" class="clip" data-start="0" data-duration="45" data-track-index="6" data-layout-allow-occlusion="" style="position: absolute; inset: 0; pointer-events: none">
        <canvas id="wipe" class="kit-wipe" width="1920" height="1080" data-layout-allow-occlusion=""></canvas>
      </div>

      <!-- captions (core.Captions, word-timed) -->
      <div id="caps" class="clip kit-caps" data-start="0" data-duration="45" data-track-index="3"></div>

      <audio id="narration" src="assets/audio/narration.wav" data-start="0" data-duration="40.32" data-track-index="10"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="45" data-track-index="11"></audio>
    </div>

    <script src="lib/core.js"></script>
    <script src="lib/story.js"></script>
    <script src="lib/kit/kit.js"></script>
    <script>
      (function () {
        "use strict";
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        var C = window.ExplainerCore, K = window.Kit, S = new C.Story(window.STORY);
        var clamp01 = C.clamp01, lerp = C.lerp, E = C.E, hash = C.hash, track = C.track;
        var INK = "#141414", PINK = "#ff4fa3", BLUE = "#1c7bd1", YEL = "#ffe14d", WARN = "#ff5a36";
        function $(id) { return document.getElementById(id); }

        // ================= story times: every beat is a word of the narration =================
        var T = {
          big: S.at(1, "大"), ask: S.phrase(1, "回答问题"), tk1: S.at(1, "token", 1), tk2: S.at(1, "token", 2), beng: S.at(1, "蹦"),
          l2: S.line(2).start, nw: S.at(2, "新"), look: S.phrase(2, "回头看"), all: S.phrase(2, "所有"),
          l3: S.line(3).start, every: S.phrase(3, "每次"), redo: S.phrase(3, "重新算"), slow: S.phrase(3, "越写越慢"), slowE: S.at(3, "慢"),
          kv: S.at(4, "KV"), how: S.phrase(4, "办法"), each4: S.at(4, "每"), key: S.at(4, "Key"), val: S.at(4, "Value"), once: S.phrase(4, "只算一次"), store: S.phrase(4, "存起来"),
          after: S.phrase(5, "之后"), only: S.phrase(5, "只算"), nw5: S.at(5, "新"), that: S.phrase(5, "那一个"), find: S.phrase(5, "再去缓存里查"), cha: S.at(5, "查"),
          cost: S.phrase(6, "代价"), vram: S.phrase(6, "显存"), cache6: S.phrase(6, "缓存"), rise: S.at(6, "涨"),
          steps6: [S.phrase(6, "跟着"), S.at(6, "着"), S.phrase(6, "上下文"), S.at(6, "下")],
          l7: S.line(7).start, llama: S.at(7, "Llama"), b7: S.at(7, "7B"), every7: S.at(7, "每"), ge7: S.at(7, "个"), tok7: S.at(7, "token"), about: S.phrase(7, "大约"),
          half: S.at(7, "0.5"), mb: S.at(7, "MB"), k4: S.at(7, "4K"), ctx7: S.phrase(7, "上下文"), need: S.phrase(7, "就要"), two: S.at(7, "2", 2), gb: S.at(7, "GB"),
          so: S.phrase(8, "所以"), gqa: S.at(8, "GQA"), share: S.phrase(8, "共用"), vv: S.at(8, "V"), paged: S.at(8, "PagedAttention"), page: S.phrase(8, "按页分配"),
          ye: S.at(8, "页"), fen: S.at(8, "分"), pei: S.at(8, "配"), quant: S.phrase(8, "量化"), press: S.phrase(8, "压缩"),
          one: S.phrase(9, "一句话"), mem9: S.phrase(9, "显存"), swap: S.at(9, "换"), spd: S.phrase(9, "速度"), onlyNew: S.phrase(9, "只算新的那一个"), nw9: S.at(9, "新"),
        };
        var CH = S.chapters, RC = S.recap;
        // scene k lives in [SEAM[k], SEAM[k+1]) — every seam is a chapter boundary, covered by a halftone dot wipe
        var SEAM = [0, CH[1].start, CH[2].start, CH[3].start, CH[3].end, RC.start];

        // ================= helpers =================
        function el(cls, parent, text, css) {
          var e = document.createElement("div");
          if (cls) e.className = cls;
          if (text != null) e.textContent = text;
          if (css) Object.assign(e.style, css);
          parent.appendChild(e);
          return e;
        }
        function fullSvg(parent, cls) {
          var s = K.svgEl("svg", { viewBox: "0 0 1920 1080", class: "full a" + (cls ? " " + cls : "") }, parent);
          return s;
        }
        function off(e) { if (e.style.visibility !== "hidden") { e.style.visibility = "hidden"; e.style.opacity = "0"; } }
        function put(e, x, y, sx, sy, r, o) {
          if (sx == null) sx = 1;
          if (sy == null) sy = sx;
          if (o == null) o = 1;
          if (o <= 0.002) { off(e); return false; }
          e.style.visibility = "visible";
          e.style.opacity = o > 0.998 ? "1" : o.toFixed(3);
          e.style.transform = "translate(" + x.toFixed(1) + "px," + y.toFixed(1) + "px) rotate(" + (r || 0).toFixed(2) + "deg) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")";
