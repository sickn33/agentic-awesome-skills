    <script src="lib/core.js"></script>
    <script src="lib/story.js"></script>
    <script src="lib/kit/kit.js"></script>
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
      import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

      // V9「一柜」· 黏土版: KV cache told as a small plasticine town — one take, every analogy labelled with its real term.
      //   写字机器人 = 大模型 · 字块 = token · 回头看的线 = 注意力 · 重算台阶 = 不用缓存每步重算 · 卡片柜 = KV cache
      //   黄标签 = Key · 蓝卡片 = Value · 放大镜 = Query · 玻璃储藏室 = 显存 · 共用一套卡 = GQA · 按页给 = PagedAttention
      //   卡片变薄 = 量化 · 天平 = 用显存换速度
      // Every frame is a pure function of t (hf-seek); every narration time comes from the story (story.at / story.phrase).
      const { clamp01, pr, lerp, E } = ExplainerCore;
      const story = new ExplainerCore.Story(window.STORY);
      const $ = (id) => document.getElementById(id);
      const S = (line, unit, nth) => story.at(line, unit, nth);
      const CL = Kit.clay(THREE, { RoundedBoxGeometry, EffectComposer, RenderPass, GTAOPass, OutputPass }, { canvas: $("gl"), shadowExtent: 26, sunPos: [-22, 40, 18], sunTarget: [-4, 0, 3] });
      const { scene, V, M, rbox, mesh, slab, canvasTex, clayMap, textTexture, squash, hop, dotFace, noAO, noShadow } = CL;
      Kit.layer = $("labels");

      const AZ = (34 * Math.PI) / 180; // the camera's azimuth: every prop that carries a word turns to face it
      const Y0 = 0.3;
      const C = {
        tile: "#fff3df", yel: "#ffd23f", sky: "#8fc8ff", red: "#ff8f80", cream: "#ffe7b3", white: "#ffffff", body: "#fff6ea", orange: "#ff9a5a",
        wood: "#e2a46c", empty: "#efe6dc", glass: "#ffffff", mint: "#a6e6cc", pink: "#ffbccd", lilac: "#d5bdff", ink: "#4a3a31",
      };

      // ================= narration times (all from the story) =================
      const T = {
        da: S(1, "大"), wen: S(1, "问"), tok1: S(1, "token", 1), tok2: S(1, "token", 2), beng: S(1, "蹦"),
        l2: story.line(2).start, xin2: S(2, "新"), hui: S(2, "回"), kan: S(2, "看"), suo: S(2, "所"), l2end: story.line(2).end,
        l3: story.line(3).start, mei3: S(3, "每"), chong: S(3, "重"), yue: S(3, "越", 1), man: S(3, "慢"),
        kv: S(4, "KV"), mei4: S(4, "每"), key: S(4, "Key"), val: S(4, "Value"), zhi4: S(4, "只"), cun4: S(4, "存"), lai4: S(4, "来"),
        zhihou: S(5, "之"), zhi5: S(5, "只"), xin5: S(5, "新"), na5: S(5, "那"), ge5: S(5, "个"), zai: S(5, "再"), qu5: S(5, "去"), huan5: S(5, "缓"), cha: S(5, "查"), l5end: story.line(5).end,
        daijia: S(6, "代"), xian6: S(6, "显"), huan6: S(6, "缓"), gen: S(6, "跟"), shang6: S(6, "上"), xia6: S(6, "下"), zhang: S(6, "涨"),
        llama: S(7, "Llama"), mei7: S(7, "每"), ge7: S(7, "个"), tok7: S(7, "token"), dayue: S(7, "大"), half: S(7, "0.5"), k4: S(7, "4K"), shang7: S(7, "上"), xia7: S(7, "下"), wen7: S(7, "文"), gb2: S(7, "2", 2), l7end: story.line(7).end,
        suoyi: S(8, "所"), gqa: S(8, "GQA"), gong: S(8, "共"), v8: S(8, "V"), paged: S(8, "PagedAttention"), an: S(8, "按"), pei: S(8, "配"), liang: S(8, "量"), ya: S(8, "压"), l8end: story.line(8).end,
        end: story.line(9).start, xian9: S(9, "显"), huan9: S(9, "换"), su: S(9, "速"), zhi9: S(9, "只"), xin9: S(9, "新"), ge9: S(9, "个"),
        recap: story.recap.start,
      };

      // ================= the ground =================
      CL.diorama(-4.0, 4.4, 31.5, 18);
      slab(-6.3, 5.4, 15.8, 3.2, Y0, Y0, "#ffd6c2", 0.3); // the writing desk lane
      slab(-6.3, 1.7, 15.8, 3.0, Y0, Y0, "#e4dcf6", 0.3); // the re-do workshop
      slab(2.9, 3.6, 6.4, 6.6, Y0, Y0, "#cdeedb", 0.3); // the storeroom lot
      slab(-4.2, 9.4, 9.0, 3.6, Y0, Y0, "#fde6c6", 0.3); // the little square
      [[-18.6, -1.8, 1.0], [-17.4, 9.6, 0.9], [-14.6, 11.6, 0.8], [-9.2, 9.9, 0.9], [1.0, 9.8, 0.85], [7.4, 8.8, 1.0], [9.6, -2.6, 0.95], [-1.6, -2.4, 0.9], [-12.4, -2.6, 1.0], [10.2, 6.4, 0.8]].forEach((p) => CL.tree(p[0], p[1], p[2]));

      // ================= the writer robot = the model =================
      const ROB = V(-12.7, Y0, 5.3);
      const faceTex = (face) => canvasTex((g, w, h) => { g.fillStyle = "#ffffff"; g.fillRect(0, 0, w, h); CL.paintFace(g, face, 128, 132, 0.95); });
      const RFACE = { open: faceTex("open"), happy: faceTex("happy"), tired: faceTex("tired"), lookR: faceTex("lookR") };
      const writer = (() => {
        const g = new THREE.Group();
        g.position.copy(ROB);
        g.rotation.y = AZ;
        const wM = M(C.white);
        mesh(rbox(1.3, 1.0, 1.0, 0.3), wM, 0, 0.62, 0, g);

      // ================= captions, chapter chip, the closing line, the recap =================

      const RECAP_AT = [

      // ================= camera: one take through the town =================
      // t, target x, y, z, frustum width, azimuth (deg)
      const A = 34;
      const CAM = [

        [T.kv + 0.5, -3.4, 2.0, 4.2, 23.0, A + 1], [T.key - 0.15, -7.4, 1.7, 4.8, 16.5, A], [T.cun4, -5.6, 1.8, 4.6, 19.0, A],
        [T.lai4 + 0.15, -2.4, 1.8, 4.3, 22.5, A], [T.xin5, -1.6, 1.6, 4.4, 18.5, A], [T.qu5, 0.6, 1.8, 4.0, 14.5, A], [T.l5end, 0.8, 1.8, 3.9, 14.8, A],

      // ================= the frame =================
      function renderAt(t) {
        CL.setIso(CAM, t);

        // --- the writer: a little press with its right arm each time a tile pops out; tired by the end of the re-do ---
        let press = 0;
        POP.forEach((p) => { press = Math.max(press, Math.sin(Math.PI * pr(t, p.from - 0.1, 0.4))); });
        STEPS.forEach((at) => { press = Math.max(press, 0.7 * Math.sin(Math.PI * pr(t, at - 0.12, 0.26))); });
        writer.armR.rotation.x = -1.3 * press;
        writer.armL.rotation.x = -0.5 * Math.sin(Math.PI * pr(t, T.da, 0.6));
        const tired = t >= T.yue && t < T.kv + 0.2;
        writer.front.map = tired ? RFACE.tired : t >= T.lai4 && t < story.line(6).start ? RFACE.happy : t >= T.xin9 + 0.3 ? RFACE.happy : RFACE.open;

        squash(writer.g, t, T.da - 0.05, 0.6);

        // --- tiles pop out of the robot one at a time; the newest is yellow with a face ---
        const dimFor5 = E.o2(pr(t, T.zhi5, 0.3)) * (1 - E.o2(pr(t, T.cha + 0.2, 0.4)));
        const dimFor9 = E.o2(pr(t, T.zhi9, 0.3));
        TILES.forEach((Tl, k) => {
          const p = POP[k];
          const u = E.io2(pr(t, p.from, p.land - p.from));
          Tl.m.visible = t >= p.from;
          if (!Tl.m.visible) return;
          Tl.m.position.copy(hop(HAND, TILE_AT(k), u, 1.6));
          const s = Math.max(0.001, 0.4 + 0.6 * E.back(pr(t, p.from, 0.22)));
          Tl.m.scale.setScalar(s);
          if (t >= p.land) squash(Tl.m, t, p.land);
          const isNew = t < NEWUNTIL[k];
          const looking = k === 3 && t >= T.hui - 0.05 && t < T.l2end + 0.1;
          Tl.front.map = isNew ? (looking ? Tl.tex.look : k === 5 && t > T.xin9 + 0.3 ? Tl.tex.happy : Tl.tex.hero) : Tl.tex.plain;
          // the earlier tiles light up as they are looked at (注意力), and when the Q finds them
          let glow = 0;
          if (k < 3) glow = 0.55 * Math.sin(Math.PI * pr(t, THREADS[2 - k].at + 0.25, 0.5)) + 0.6 * Math.sin(Math.PI * pr(t, T.suo - 0.05, 0.9));
          if (k < 4) glow = Math.max(glow, 0.5 * Math.sin(Math.PI * pr(t, T.mei4 + k * 0.2, 0.5)));
          if (k === 4) glow = 0.7 * Math.sin(Math.PI * pr(t, T.cha + 0.35, 0.6));
          Tl.front.emissiveIntensity = Math.max(0, glow);
          // only the new one computes: the others go quiet
          const dim = (k < 4 ? dimFor5 : 0) + (k < 5 ? dimFor9 : 0);
          const c = 1 - 0.32 * Math.min(1, dim);
          Tl.front.color.setScalar(c);
          Tl.side.color.set(C.tile).multiplyScalar(c);
        });
        // attention threads grow from the new tile back to each earlier one, then fade
        THREADS.forEach((th) => {
          const u = E.o3(pr(t, th.at, 0.32)), out = pr(t, T.l2end, 0.3);
          th.mm.visible = u > 0 && out < 1;
          th.geo.setDrawRange(0, Math.round(u * 40) * 8 * 6);
          th.mm.scale.setScalar(1);
          th.mm.material.opacity = 1;
          th.mm.position.y = -2.5 * E.i2(out);
        });

        // --- the re-do workshop: each step drops a card on every column so far; the re-made ones are waste ---
        STAIR.forEach((c) => {
          const rest = Y0 + 0.1 + c.level * CARD_H;
          c.m.visible = t >= c.at;
          if (!c.m.visible) return;
          const u = E.i2(pr(t, c.at, 0.2));
          c.m.position.set(TX(c.k), rest + 1.5 * (1 - u), SZ);
          c.m.scale.setScalar(1);
          if (u >= 1) squash(c.m, t, c.at + 0.2, 0.7);
        });
        PLATES.forEach((pl) => { const u = pr(t, pl.at - 0.1, 0.3); pl.m.visible = u > 0; pl.m.scale.setScalar(Math.max(0.001, E.back(u))); });
        wasteM.emissiveIntensity = 0.55 * Math.sin(Math.PI * pr(t, T.chong - 0.05, 0.7)) + 0.35 * Math.sin(Math.PI * pr(t, T.yue, 0.8));
        firstM.emissiveIntensity = 0.3 * Math.sin(Math.PI * pr(t, T.mei3, 0.5));

        // --- the cabinet drops in on "KV cache" ---
        const land = T.kv + 0.42;
        const du = E.i2(pr(t, T.kv - 0.05, 0.47));
        cab.visible = t >= T.kv - 0.05;
        cab.position.set(CABP.x, CABP.y + 7 * (1 - du), CABP.z);
        cab.scale.setScalar(1);
        if (t >= land) squash(cab, t, land, 0.8);

        // --- each token makes its K tag (Key) and V card (Value) once, then they fly into a drawer ---
        PAIRS.forEach((P, k) => {
          const pt = PAIR_T[k], tile = TILE_AT(k);
          const kHome = tile.clone().add(V(-0.45, 1.2, 0.2)), vHome = tile.clone().add(V(0.32, 1.42, -0.05));
          const kIn = cabW(KX, rowY(k), FZ + 0.02), vIn = cabW(VX, rowY(k), FZ + 0.02);
          const ku = pr(t, pt.kAt, 0.3), vu = pr(t, pt.vAt, 0.3);
          const fk = E.io2(pr(t, pt.fly, FLY)), fv = E.io2(pr(t, pt.fly + 0.08, FLY));
          P.km.visible = ku > 0 && fk < 1;
          P.vm.visible = vu > 0 && fv < 1;
          P.km.position.copy(hop(kHome, kIn, fk, 2.4));
          P.vm.position.copy(hop(vHome, vIn, fv, 2.6));
          P.km.scale.setScalar(Math.max(0.001, E.back(ku) * (1 - 0.45 * fk)));
          P.vm.scale.setScalar(Math.max(0.001, E.back(vu) * (1 - 0.6 * fv)));
          const ou = pr(t, pt.oneAt, 0.25);
          P.one.visible = ou > 0 && t < pt.fly;
          P.one.position.copy(tile.clone().add(V(-0.05, 2.25, 0.3)));
          P.one.scale.setScalar(Math.max(0.001, E.back(ou)));
          const filled = t >= pt.fly + 0.08 + FLY;
          const D = DRAW[k];
          D.kM.map = filled ? D.kTex : emptyK;
          D.vM.map = filled ? D.vTex : emptyK;
          // a drawer slides out to take its card, then closes
          const open = Math.sin(Math.PI * pr(t, pt.fly + 0.05, FLY + 0.25));
          D.kD.position.z = D.vD.position.z = FZ + 0.35 * open;
          const lit = 0.6 * Math.sin(Math.PI * pr(t, pt.fly + FLY, 0.5));
          D.kM.emissiveIntensity = D.vM.emissiveIntensity = lit;
        });
        // the last empty drawer fills as the storeroom takes over (more context, same cabinet)
        DRAW[5].kM.map = t >= T.huan6 ? DRAW[5].kTex : emptyK;
        DRAW[5].vM.map = t >= T.huan6 ? DRAW[5].vTex : emptyK;

        // --- the magnifier (Query) of the new token scans the K column; weights; V's flow back ---
        const magOn = t >= T.zai - 0.05 && t < T.cha + 0.9;
        mag.visible = magOn;
        const magStart = TILE_AT(4).add(V(0, 1.7, 0.3));
        const scanTop = cabW(KX, rowY(4), FZ + 0.6), scanBot = cabW(KX, rowY(0), FZ + 0.6);
        const scanU = E.io2(pr(t, T.huan5 - 0.05, T.cha - T.huan5 - 0.05));
        if (t < T.huan5) mag.position.copy(hop(magStart, scanTop, E.io2(pr(t, T.zai, T.huan5 - T.zai)), 1.4));
        else mag.position.copy(scanTop.clone().lerp(scanBot, scanU));
        mag.scale.setScalar(Math.max(0.001, E.back(pr(t, T.zai - 0.05, 0.3)) * (1 - pr(t, T.cha + 0.6, 0.3))));
        WBARS.forEach((B, r) => {
          const passAt = T.huan5 - 0.05 + (T.cha - T.huan5 - 0.05) * ((4 - r) / 4);
          const u = E.back(pr(t, passAt, 0.28)) * (1 - pr(t, story.line(6).start - 0.4, 0.4));
          const len = 0.3 + 2.4 * B.w;
          B.b.visible = u > 0.001;
          B.b.scale.set(Math.max(0.001, u * len), 1, 1);
          B.b.position.set(-1.62 - (u * len) / 2, rowY(r), FZ - 0.1);
        });
        BACK.forEach((b, r) => {
          const a = T.cha + 0.04 * r, u = E.io2(pr(t, a, 0.5));
          b.visible = u > 0 && u < 1;
          b.position.copy(hop(cabW(VX, rowY(r), FZ + 0.2), TILE_AT(4).add(V(0, 0.4, 0.2)), u, 1.6));
          b.scale.setScalar(0.5 + 1.1 * WEIGHTS[r]);
        });

        // --- the storeroom (显存) rises around the cabinet; the cabinet grows a section per 1K of context ---
        const cu = E.o3(pr(t, T.xian6 - 0.1, 0.55));
        caseG.visible = cu > 0;
        POSTS.forEach((p) => { p.scale.y = Math.max(0.001, cu); p.position.y = (CASE_H * cu) / 2; });
        RIMS.forEach((r) => { r.visible = cu > 0.98; });
        paneM.opacity = 0.22 * cu;
        TICKS.forEach((tk, i) => { tk.visible = t >= CTX_AT[i]; tk.scale.setScalar(Math.max(0.001, E.back(pr(t, CTX_AT[i], 0.3)))); });
        band.material.opacity = 0.35 * E.o2(pr(t, T.gb2, 0.3)) * (1 - pr(t, T.suoyi, 0.4));
        const SEC_DROP = [T.gen, T.shang6, T.xia6];
        const SEC_GONE = [T.gong + 0.39, T.gong + 0.22, T.gong + 0.05];
        // each section stretches up out of the one below (clay grows, it is not stacked), and pancakes away on GQA
        let top = BODY_TOP;
        SECTIONS.forEach((s, i) => {
          const grow = E.back(pr(t, SEC_DROP[i] - 0.18, 0.36)), gone = E.io2(pr(t, SEC_GONE[i], 0.3));
          const h = Math.max(0.001, grow * (1 - gone));
          s.m.visible = grow > 0 && gone < 1;
          s.m.scale.set(1 + 0.08 * Math.sin(Math.PI * Math.min(1, grow)) + 0.15 * Math.sin(Math.PI * gone), h, 1);
          s.m.position.y = top + (SEC_H * h) / 2;
          top += SEC_H * h;
          // 4K: each 1K lights in turn; 2 GB: the whole tower warms
          const g1 = 0.55 * Math.sin(Math.PI * pr(t, [T.shang7, T.xia7, T.wen7][i], 0.5));
          const g2 = 0.35 * E.o2(pr(t, T.gb2, 0.3)) * (1 - pr(t, T.suoyi, 0.4));
          s.sm.emissive.set(g2 > g1 ? "#ff7a5c" : "#ffd23f");
          s.fm.emissive.set(g2 > g1 ? "#ff7a5c" : "#ffd23f");
          s.sm.emissiveIntensity = s.fm.emissiveIntensity = Math.max(g1, g2 * 0.6);
        });
        // the tower bumps on 涨
        const bump = Math.sin(Math.PI * pr(t, T.zhang, 0.3)) * 0.06;
        // quantization: every card gets thinner — the whole cabinet halves
        const qz = 1 - 0.45 * E.io3(pr(t, T.liang + 0.05, 0.45));
        cabBody.scale.y = qz * (1 + bump);
        const qPop = Math.sin(Math.PI * pr(t, T.ya, 0.25)) * 0.05;
        cabBody.scale.x = cabBody.scale.z = 1 + qPop;
        crown.position.y = top * cabBody.scale.y;
        // one token's pair, opened: 2 (K, V) × 32 layers, then folded back to one drawer ≈ 0.5 MB
        const pull = Math.sin(Math.PI * pr(t, T.mei7 - 0.1, T.k4 - T.mei7 + 0.1));
        const fan = E.o3(pr(t, T.ge7, 0.45)) * (1 - E.io2(pr(t, T.half - 0.15, 0.35)));
        acc.visible = pull > 0.02;
        acc.position.set(0, rowY(0) - 0.1, FZ + 0.3 + 0.9 * pull);
        SLICES.forEach((sl, i) => { sl.position.set(0, i * 0.1 * fan, 0); sl.visible = i === 0 || fan > 0.01; });

        // --- GQA: four readers, four copies of K/V → one shared copy; the tower ÷4 ---
        READERS.forEach((R, k) => {
          const u = pr(t, R.at, 0.3);
          R.g.visible = u > 0;
          R.g.scale.setScalar(Math.max(0.001, E.back(u)));
          const mu = E.io2(pr(t, T.gong + 0.02 * k, 0.5));
          const pos = R.home.clone().lerp(SHARED, mu);
          R.mk.visible = R.mv.visible = u > 0 && (k === 1 || mu < 1);
          const sc = Math.max(0.001, E.back(pr(t, R.at + 0.1, 0.3))) * (1 + (k === 1 ? 0.5 * mu : 0));
          R.mk.position.copy(pos.clone().add(V(-0.26, 0.02, 0.03)));
          R.mv.position.copy(pos.clone().add(V(0.2, 0.1, -0.03)));
          R.mk.scale.setScalar(sc);
          R.mv.scale.setScalar(sc);
        });
        GQA_THREADS.forEach((th) => {
          const u = E.o3(pr(t, th.at, 0.3));
          th.mm.visible = u > 0;
          th.geo.setDrawRange(0, Math.round(u * 24) * 8 * 6);
        });
        poofs.forEach((pf, i) => pf.render(t, SEC_GONE[i], cabW(0, BODY_TOP + i * SEC_H + SEC_H / 2, 0.2)));

        // --- PagedAttention: a mostly-empty reservation splits into pages and the unused ones go back ---
        let reservedH = 0;
        PAGES.forEach((pg) => {
          const grow = E.o3(pr(t, T.paged + pg.i * 0.03, 0.3));
          const gap = 0.07 * E.io2(pr(t, T.an, 0.3));
          const gone = pr(t, T.an + 0.32 + (7 - pg.i) * 0.07, 0.2);
          pg.m.visible = grow > 0 && gone < 1;
          pg.m.position.y = BODY_TOP * cabBody.scale.y + PAGE_H / 2 + pg.i * (PAGE_H + gap);
          pg.m.scale.set(1, Math.max(0.001, grow * (1 - E.i2(gone))), 1);
          pg.pm.opacity = 0.62 * grow;
          if (pg.m.visible) reservedH = Math.max(reservedH, pg.m.position.y - BODY_TOP * cabBody.scale.y + (PAGE_H * pg.m.scale.y) / 2);
        });
        const np = E.back(pr(t, T.pei - 0.05, 0.35));
        nextPage.visible = np > 0;
        nextPage.scale.set(1, Math.max(0.001, np), 1);
        nextPage.position.y = BODY_TOP * cabBody.scale.y + PAGE_H / 2 + 0.04;
        nextPage.material.opacity = 0.45 * Math.min(1, np) * (1 - pr(t, T.liang - 0.1, 0.3));
        crown.position.y = Math.max(crown.position.y, BODY_TOP * cabBody.scale.y + reservedH, BODY_TOP * cabBody.scale.y + PAGE_H * Math.min(1, np) * (1 - pr(t, T.liang - 0.1, 0.3)));

        // --- the balance: memory on one pan, speed on the other ---
        const bu = pr(t, T.end - 0.05, 0.4);
        bal.visible = bu > 0;
        bal.position.set(BALP.x, BALP.y, BALP.z);
        bal.scale.setScalar(Math.max(0.001, E.back(bu)));
        const memIn = E.i2(pr(t, T.xian9 - 0.25, 0.28)), boltIn = E.i2(pr(t, T.su - 0.25, 0.28));
        memBlock.visible = memIn > 0;
        memBlock.position.set(0, -0.66 + 2.2 * (1 - memIn), 0);
        bolt.visible = boltIn > 0;
        bolt.position.set(0, -0.36 + 2.2 * (1 - boltIn), 0);
        bolt.rotation.y = -0.3;
        const tilt = 0.2 * E.o3(pr(t, T.xian9 + 0.03, 0.3)) - 0.2 * E.back(pr(t, T.su + 0.03, 0.45));
        beam.rotation.z = tilt;
        pans.forEach((h) => { h.rotation.z = -tilt; });
        if (t >= T.xian9 + 0.03) squash(memBlock, t, T.xian9 + 0.03, 0.8);
        // the spotlight on the newest token
        const sp = E.o2(pr(t, T.xin9 - 0.05, 0.4));
        spotM.opacity = 0.2 * sp;
        spotFloorM.opacity = 0.5 * sp;
        spot.visible = spotFloor.visible = sp > 0;

        scene.updateMatrixWorld(); // labels anchored to moving parts (pans) project with this frame's matrices
        placeStickers(t);
        placeRecap(t);
        caps.render(t);
        chap.render(t);
        title.render(t);
        CL.render();
      }

      Kit.boot("kv-cache-v9-clay", renderAt, {
        story,
        text: TOK.join("") + "K V Q1Q2Q3Q4×1天空为什么是蓝的？写字机器人大模型字块新来的回头看注意力重算台阶不用缓存卡片柜黄标签蓝卡片玻璃储藏室显存",
        afterFonts: () => CL.redraw(),
      });
    </script>
  </body>
