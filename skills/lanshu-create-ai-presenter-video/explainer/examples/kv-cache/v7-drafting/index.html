<!DOCTYPE html>
<html lang="zh-CN" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>KV cache · V7 图纸与注脚</title>
    <link rel="stylesheet" href="lib/kit/kit.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* fonts:begin */
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/noto-sans-sc-900.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: block; }
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/noto-sans-sc-500.woff2") format("woff2"); font-weight: 500; font-style: normal; font-display: block; }
@font-face { font-family: "Noto Serif SC"; src: url("assets/fonts/noto-serif-sc-600.woff2") format("woff2"); font-weight: 600; font-style: normal; font-display: block; }
@font-face { font-family: "Archivo"; src: url("assets/fonts/archivo-x-900.woff2") format("woff2"); font-weight: 900; font-style: normal; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url("assets/fonts/jetbrains-mono-400.woff2") format("woff2"); font-weight: 400; font-style: normal; font-display: block; }
@font-face { font-family: "Instrument Serif"; src: url("assets/fonts/instrument-serif-400i.woff2") format("woff2"); font-weight: 400; font-style: italic; font-display: block; }
/* fonts:end */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0b0b0c;
      }
      #sheet {
        left: -200px;
        top: -200px;
        width: 6520px;
        height: 2780px;
      }
      #cells,
      #endwrap,
      #recapwrap,
      #fx {
        position: absolute;
        left: 0;
        top: 0;
      }
      #endwrap,
      #recapwrap,
      #fx {
        inset: 0;
        pointer-events: none;
      }
      .abs {
        position: absolute;
        white-space: nowrap;
      }
      .mono {
        font-family: var(--kit-font-mono);
      }
      .cn5 {
        font-family: var(--kit-font-body);
        font-weight: 500;
      }
      .dim {
        color: var(--kit-muted);
      }
      .acc {
        color: var(--kit-accent);
      }
      .red {
        color: var(--kit-warn);
      }
      .blue {
        color: var(--kit-accent-2);
      }
      /* a token is a drafted part: a box with its text */
      .tok {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid rgba(237, 235, 230, 0.72);
        background: rgba(11, 11, 12, 0.7);
        font-family: var(--kit-font-body);
        font-weight: 500;
        color: var(--kit-ink);
        white-space: nowrap;
      }
      .tok.new {
        border-color: var(--kit-accent);
        background: var(--kit-accent);
        color: #0b0b0c;
        box-shadow: 0 0 26px rgba(255, 190, 0, 0.55);
      }
      .tok.slot {
        border: 2px dashed rgba(237, 235, 230, 0.28);
        background: none;
      }
      /* K is a key tag (it is matched), V a block of content (it is taken), Q the question a new token asks */
      .kt,
      .vb,
      .qt {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 76px;
        height: 40px;
        font-family: var(--kit-font-mono);
        font-size: 24px;
        white-space: nowrap;
      }
      .kt {
        padding-right: 12px;
        border: 2.5px solid var(--kit-ink);
        border-radius: 6px 20px 20px 6px;
        color: var(--kit-ink);
        background: rgba(11, 11, 12, 0.8);
      }
      .kt::after {
        content: "";
        position: absolute;
        right: 8px;
        top: 50%;
        width: 8px;
        height: 8px;
        margin-top: -4px;
        border: 2px solid currentColor;
        border-radius: 50%;
      }
      .vb {
        border: 2.5px solid #dcd9d2;
        background: #dcd9d2;
        color: #141311;
      }
      .qt {
        border: 2.5px solid var(--kit-accent-2);
        border-radius: 20px 6px 6px 20px;
        color: var(--kit-accent-2);
        background: rgba(11, 11, 12, 0.8);
      }
      .kt.new {
        border-color: var(--kit-accent);
        color: var(--kit-accent);
        box-shadow: 0 0 18px rgba(255, 190, 0, 0.45);
      }
      .vb.new {
        border-color: var(--kit-accent);
        background: var(--kit-accent);
      }
      .c {
        position: absolute;
        display: block;
        border: 1.5px solid rgba(237, 235, 230, 0.4);
        background: rgba(237, 235, 230, 0.5);
      }
      .code {
        position: absolute;
        white-space: pre;
        font-family: var(--kit-font-mono);
        font-size: 24px;
        line-height: 36px;
        color: rgba(237, 235, 230, 0.9);
      }
      .plate {
        position: absolute;
        background: #0b0b0c;
        border: 1.5px solid rgba(237, 235, 230, 0.3);
      }
      .bill-row {
        position: absolute;
        left: 32px;
        display: flex;
        align-items: baseline;
        white-space: nowrap;
        color: #141311;
      }
      .bill-row b {
        display: inline-block;
        width: 210px;
        text-align: right;
        margin-right: 22px;
        font-family: var(--kit-font-latin);
        font-weight: 900;
        font-size: 36px;
      }
      .bill-row span {
        font-family: var(--kit-font-body);
        font-weight: 500;
        font-size: 28px;
      }
      /* highlighter on the bill: a background that grows left → right (no negative z-index) */
      .hlt {
        --h: 0;
        padding: 0 6px;
        border-radius: 3px 8px 5px 9px;
        background: linear-gradient(rgba(255, 206, 20, 0.78), rgba(255, 206, 20, 0.78)) no-repeat left center / calc(var(--h) * 100%) 92%;
      }
      .spot2 {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 220, 90, 0.28), rgba(255, 220, 90, 0) 70%);
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root" class="kit-root" data-composition-id="main" data-start="0" data-duration="45" data-width="1920" data-height="1080">
      <div id="stage" class="clip kit-stage" data-start="0" data-duration="45" data-track-index="1" data-layout-allow-overflow="">
        <div id="world" class="kit-world" data-layout-allow-overflow="">
          <div id="sheet" class="kit-sheet"></div>
          <div id="cells"></div>
          <svg class="kit-svg" id="leaders" style="left: 0; top: 0" width="6400" height="2600" viewBox="0 0 6400 2600"></svg>
          <svg class="kit-svg" id="sparks" style="left: 0; top: 0" width="6400" height="2600" viewBox="0 0 6400 2600"></svg>
        </div>
        <div id="chap"></div>
        <div id="endwrap" data-layout-allow-overflow=""></div>
        <div id="recapwrap" data-layout-allow-overflow=""></div>
        <div id="fx"></div>
      </div>
      <audio id="narration" src="assets/audio/narration.wav" data-start="0" data-duration="40.32" data-track-index="10"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="45" data-track-index="11"></audio>
    </div>

    <script src="lib/core.js"></script>
    <script src="lib/story.js"></script>
    <script src="lib/kit/kit.js"></script>
    <script>
      (function () {
        "use strict";
        /* KV cache, drawn as one V7 drawing sheet. Every beat time comes from the story (story.at / story.phrase) plus
         * small offsets; every frame is a pure function of t (one driver tween calls frame(t)). */
        const CX = ExplainerCore, { clamp01, pr, lerp, E } = CX;
        const U = Kit.util, { op, show, draw, svg, el, typed, pulse } = U;
        const story = new CX.Story(window.STORY);
        const at = (l, u, n) => story.at(l, u, n);
        const ph = (l, s) => story.phrase(l, s);
        const $ = (id) => document.getElementById(id);
        const T = Kit.tokens;
        const TOK = ["因为", "空气", "把", "蓝光", "散射", "得", "更", "多"];
        const SP = Kit.sparks($("sparks"));
        const R = []; // per-frame renders of kit components

        // ---------------- builders ----------------
        function mkCell(n, x, y) {
          const c = Kit.cell($("cells"), { x, y, n, bx: 1772, by: 56 });
          const s = svg("svg", { class: "kit-svg", width: 1920, height: 1080, viewBox: "0 0 1920 1080", style: "left:0;top:0" }, c);
          return { c, s, x, y };
        }
        function put(parent, node, x, y) {
          node.style.left = x + "px";
          node.style.top = y + "px";
          parent.appendChild(node);
          return node;
        }
        function txt(parent, cls, x, y, text, css) {
          const e = el("div", "abs " + (cls || ""), parent, text);
          e.style.left = x + "px";
          e.style.top = y + "px";
          if (css) e.style.cssText += css;
          return e;
        }
        function box(parent, cls, x, y, w, h, text, css) {
          const e = el("div", cls, parent, text);
          e.style.left = x + "px";
          e.style.top = y + "px";
          if (w) e.style.width = w + "px";
          if (h) e.style.height = h + "px";
          if (css) e.style.cssText += css;
          return e;
        }
        function gh(cell, x, y, size, o) {
          o.story = story;
          const g = Kit.ghost(o);
          g.el.style.left = x + "px";
          g.el.style.top = y + "px";
          g.el.style.fontSize = size + "px";
          cell.appendChild(g.el);
          R.push((t) => g.render(t));
          return g;
        }
        function note(cell, x, y, tag, text, a) {
          const n = Kit.note(text, { tag });
          put(cell, n.el, x, y);
          R.push((t) => n.render(t, a));
          return n;
        }
        function foot(cell, x, y, mark, text, a) {
          const f = Kit.footnote({ mark, text });
          put(cell, f.el, x, y);
          R.push((t) => f.render(t, a));
          return f;
        }
        function label(cell, x, y, o, a, b) {
          const l = Kit.label(o);
          put(cell, l.el, x, y);
          R.push((t) => l.render(t, a, b));
          return l;
        }
        function cls(e, c) { if (e._c !== c) { e.className = c; e._c = c; } }
        function tr(e, s) { if (e._tr !== s) { e.style.transform = s; e._tr = s; } }
        function xy(e, x, y) { e.style.left = x.toFixed(1) + "px"; e.style.top = y.toFixed(1) + "px"; }
        const arrowHead = (x, y, dir) => (dir > 0 ? `M ${x - 14} ${y - 9} L ${x} ${y} L ${x - 14} ${y + 9}` : `M ${x + 14} ${y - 9} L ${x} ${y} L ${x + 14} ${y + 9}`);

        const C1 = mkCell(1, 0, 0), C2 = mkCell(2, 2100, 0), C3 = mkCell(3, 4200, 0), C4 = mkCell(4, 4200, 1300), C5 = mkCell(5, 2100, 1300), C6 = mkCell(null, 0, 1300);

        // ======================= 图 1 · 一个一个往外蹦，每次都回头看 =======================
        const c1 = C1.c, s1 = C1.s;
        gh(c1, 116, 130, 96, { line: 1, upto: "，" });
        gh(c1, 120, 244, 60, { line: 1, from: "是", punch: [{ phrase: "蹦", amp: 0.3, dur: 0.4 }] });
        gh(c1, 120, 786, 60, { line: 2, upto: "，", accent: ["新token"], lead: 2.6 });
        gh(c1, 120, 862, 60, { line: 2, from: "都要", lead: 2.6 });
        const tEmit = [at(1, "token", 1), at(1, "token", 2), at(1, "蹦"), at(2, "蹦")];
        note(c1, 120, 326, "自回归", "每次只生成 1 个 token", tEmit[1] + 0.2);
        note(c1, 120, 952, "注意力", "新 token 要和前面每一个比一比", at(2, "token", 2) + 0.05);
        foot(c1, 1050, 956, "¹", "softmax(q·Kᵀ/√d)·V：q 给每个 k 打分，按分数取 V", at(2, "所") + 0.15);
        // the prompt, the model, the output row
        const prm = box(c1, "abs", 120, 438, 380, 78, null, "border:2px solid rgba(237,235,230,0.72)");
        const prmL = txt(c1, "mono dim", 120, 398, "prompt", "font-size:24px");
        const prmT = txt(c1, "cn5", 142, 456, "", "font-size:32px");
        const mdl = svg("rect", { x: 560, y: 428, width: 200, height: 100, class: "kit-ln", style: "stroke-width:3" }, s1);
        const mdlT = txt(c1, "", 598, 448, "LLM", "font-family:var(--kit-font-latin);font-weight:900;font-size:48px");
        const stepT = txt(c1, "mono", 598, 538, "", "font-size:26px");
        const arr1 = svg("path", { class: "kit-ln", d: "M 504 477 L 552 477 " + arrowHead(552, 477, 1) }, s1);
        const arr2 = svg("path", { class: "kit-ln", d: "M 764 477 L 826 477 " + arrowHead(826, 477, 1) }, s1);
        const slotX = (i) => 840 + i * 122;
        const toks1 = TOK.map((w, i) => {
          const slot = box(c1, "tok slot", slotX(i), 440, 110, 74);
          const tk = box(c1, "tok", slotX(i), 440, 110, 74, w, "font-size:32px");
          const idx = txt(c1, "mono dim", slotX(i) + 44, 404, String(i + 1), "font-size:24px");
          return { slot, tk, idx, i };
        });
        // the decode loop, as the drawing's insider margin note
        const CODE = ["while 没说完:", "    下一个 = 模型(问题 + 已输出)", "    已输出 += 下一个    # 一次 1 个"];
        const codeL = txt(c1, "mono dim", 120, 608, "伪代码 · 解码循环", "font-size:24px");
        const codeHL = box(c1, "abs", 112, 680, 560, 36, null, "background:rgba(255,210,30,0.16);border-left:3px solid #ffd21e");
        const codeEls = CODE.map((s, k) => { const e = txt(c1, "code", 120, 644 + k * 36, ""); e.setAttribute("data-layout-allow-overlap", ""); return e; });
        // looking back: one arc from the new token to every earlier one (and the prompt)
        const NEWI = 3, nx = slotX(NEWI) + 55, ny = 516;
        const targets = [2, 1, 0].map((j) => ({ x: slotX(j) + 55, j })).concat([{ x: 470, j: -1 }]);
        const tBack = at(2, "回"), tAll = at(2, "所");
        const arcs = targets.map((g, k) => {
          const dx = nx - g.x, depth = Math.min(150, 30 + 0.16 * dx);
          const p = svg("path", { class: "kit-blue", d: `M ${nx} ${ny} Q ${(nx + g.x) / 2} ${ny + depth * 2} ${g.x} ${ny}`, style: "stroke-width:2.5" }, s1);
          const head = svg("circle", { r: 7, fill: T.accent2, opacity: 0 }, s1);
          return { p, len: p.getTotalLength(), head, a: tBack + k * 0.13, g };
        });
        arcs.forEach((A) => SP.burst(A.g.x, ny, A.a + 0.28, 6));
        label(c1, slotX(NEWI) - 20, 334, { text: "新 token", tone: "accent" }, at(2, "新"));
        label(c1, 1380, 568, { text: "回头看 = 注意力¹", sub: "attention", tone: "q" }, tBack + 0.1);
        tEmit.forEach((te, i) => SP.burst(slotX(i) + 55, 440, te + 0.3, 10, Math.PI, true));
        function fig1(t) {
          op(prm, pr(t, 0.45, 0.25));
          op(prmL, pr(t, 0.45, 0.25));
          typed(prmT, "天空为什么是蓝的？", t, at(1, "回"), 16);
          draw(mdl, 600, E.io2(pr(t, 0.4, 0.35)));
          op(mdlT, pr(t, 0.6, 0.2));
          op(arr1, pr(t, 1.3, 0.2));
          op(arr2, pr(t, 1.6, 0.2));
          let n = 0;
          tEmit.forEach((te) => { if (t >= te) n++; });
          const flash = Math.max(...tEmit.map((te) => pulse(t, te - 0.06, 0.32)));
          mdl.style.stroke = flash > 0.05 ? T.accent : "";
          mdl.style.filter = flash > 0.05 ? `drop-shadow(0 0 ${(14 * flash).toFixed(1)}px rgba(255,190,0,0.9))` : "";
          U.setText(stepT, t < tEmit[0] ? "" : "第 " + n + " 步");
          const allFlash = pulse(t, tAll - 0.05, 0.5);
          toks1.forEach((o) => {
            const i = o.i, te = i < tEmit.length ? tEmit[i] : Infinity;
            op(o.slot, pr(t, 1.7 + i * 0.05, 0.25) * (t >= te + 0.3 ? 0 : 1));
            if (t < te) { show(o.tk, 0); op(o.idx, 0); return; }
            const u = E.io3(pr(t, te, 0.32));
            show(o.tk, 1);
            op(o.idx, pr(t, te + 0.2, 0.2));
            const x = lerp(770, slotX(i), u), y = 440 - Math.sin(Math.PI * u) * 46;
            xy(o.tk, x, y);
            tr(o.tk, `scale(${(0.6 + 0.4 * u).toFixed(3)})`);
            cls(o.tk, i === n - 1 ? "tok new" : "tok");
            const lit = i < NEWI && t >= tAll ? allFlash : 0;
            o.tk.style.borderColor = lit > 0.02 ? T.accent2 : "";
            o.tk.style.boxShadow = lit > 0.02 ? `0 0 ${(20 * lit).toFixed(1)}px rgba(127,200,248,0.8)` : "";
          });
          prm.style.borderColor = t >= tAll ? (allFlash > 0.02 ? T.accent2 : "") : "";
          // the loop runs once per token: its body lights at every emit
          op(codeL, pr(t, 0.9, 0.2));
          typed(codeEls[0], CODE[0], t, 1.0, 60, 1.25);
          typed(codeEls[1], CODE[1], t, 1.25, 60, 1.8);
          typed(codeEls[2], CODE[2], t, 1.8, 60);
          const hit = Math.max(...tEmit.map((te) => pulse(t, te - 0.1, 0.45)));
          op(codeHL, Math.max(hit, t > tEmit[0] ? 0.35 : 0));
          // look back: the arcs sweep left from the new token, then everything earlier lights at once
          arcs.forEach((A) => {
            const u = E.io2(pr(t, A.a, 0.3));
            draw(A.p, A.len, u);
            op(A.p, t >= A.a ? 1 : 0);
            A.p.style.strokeWidth = t >= tAll ? (2.5 + 1.5 * allFlash).toFixed(2) : "2.5";
            const q = A.p.getPointAtLength(u * A.len);
            A.head.setAttribute("cx", q.x.toFixed(1));
            A.head.setAttribute("cy", q.y.toFixed(1));
            A.head.setAttribute("opacity", t >= A.a && u < 1 ? 1 : 0);
          });
        }

        // ======================= 图 2 · 不缓存：每一步都重算前面全部 =======================
        const c2 = C2.c, s2 = C2.s;
        gh(c2, 120, 124, 60, { line: 3, upto: "，", warn: ["重新算"] });
        gh(c2, 116, 200, 96, { line: 3, from: "就会", warn: ["越写越慢"], punch: [{ phrase: "慢", amp: 0.22, dur: 0.4 }] });
        const X0 = 330, Y0 = 384, P = 66, CS = 58;
        const tRow0 = at(3, "每"), tRe = at(3, "重"), tSlow = at(3, "越");
        const rowT = (r) => tRow0 + r * 0.1;
        TOK.forEach((w, c) => txt(c2, "cn5 dim", X0 + P * c + 29 - (w.length * 24) / 2, 340, w, "font-size:24px"));
        const rowL = TOK.map((w, r) => txt(c2, "mono dim", 196, Y0 + P * r + 14, "第 " + (r + 1) + " 步", "font-size:24px"));
        const tri = [];
        for (let r = 0; r < 8; r++) for (let c = 0; c <= r; c++) {
          const e = box(c2, "abs", X0 + P * c, Y0 + P * r, CS, CS);
          e.className = "c";
          e.style.position = "absolute";
          tri.push({ e, r, c });
        }
        // the checker's redline around everything that is computed again: a staircase revision cloud
        const gx = (c) => X0 + P * c - 4, gy = (r) => Y0 + P * r - 4;
        const stair = [[gx(0), gy(1)]];
        for (let r = 1; r <= 7; r++) { stair.push([gx(r), gy(r)]); stair.push([gx(r), gy(r + 1)]); }
        stair.push([gx(0), gy(8)]);
        const cloud = Kit.revcloud(s2, { pts: stair, r: 9, tag: "重复计算", tx: X0 + 4.6 * P, ty: Y0 + 1.6 * P });
        const tCloud = at(3, "算") + 0.05;
        const dimTri = Kit.dim(s2, { x1: X0, y1: Y0 + 8 * P - 8, x2: X0 + 8 * P - 8, y2: Y0 + 8 * P - 8, text: "第 8 步：8 份", off: 26 });
        label(c2, X0 + 4.1 * P, Y0 + 2.9 * P, { text: "总量 ≈ n²/2 ¹", tone: "warn" }, tSlow + 0.3);
        foot(c2, 1040, 296, "¹", "1+2+…+n = n(n+1)/2：算量像个三角形", tSlow + 0.5);
        // the same steps as a cost chart: one stacked bar per step (new part in accent, recomputed part in redline)
        const BX = 1100, BY = 900, BP = 86, BW = 52, BH = 52;
        const axes = svg("path", { class: "kit-ln", d: `M 1060 440 L 1060 ${BY} L 1790 ${BY}`, style: "stroke-width:2" }, s2);
        const chT = txt(c2, "mono", 1060, 372, "每一步要算几份 K/V", "font-size:26px");
        const yL = txt(c2, "cn5 dim", 1074, 432, "份数", "font-size:24px");
        const xT = txt(c2, "mono dim", 1610, 944, "第几步 →", "font-size:24px");
        const bars2 = TOK.map((w, k) => {
          const red = box(c2, "abs", BX + BP * k, BY, BW, 0, null, "background:#ff5b3a");
          const yel = box(c2, "abs", BX + BP * k, BY, BW, 0, null, "background:#ffd21e");
          const xl = txt(c2, "mono dim", BX + BP * k + 18, 908, String(k + 1), "font-size:24px");
          return { red, yel, xl, k };
        });
        const ramp = svg("path", { class: "kit-red", d: `M ${BX + BW / 2} ${BY - BH - 18} L ${BX + BP * 7 + BW / 2} ${BY - BH * 8 - 18}`, style: "stroke-width:3;stroke-dasharray:12 10" }, s2);

          xy(memT, lx - 28, ly + 46);
          xy(spdT, rx - 40, ry - 62 - 16 * E.o3(pr(t, tSpeed, 0.3)));
          show(memT, pv * pr(t, tSpend, 0.2));
          show(spdT, pv * pr(t, tSpeed, 0.2));
          // only the newest one is computed
          const lv = pr(t, END + 0.6, 0.3) * (1 - pr(t, story.recap.start, 0.3));
          const dimOld = E.o2(pr(t, tOnly, 0.3));
          lastRow.forEach((e, i) => {
            show(e, lv);
            if (i === 4) cls(e, t >= tNewest ? "tok new" : "tok");
            else op(e, lv * (1 - 0.6 * dimOld));
          });
          show(spot, lv * E.o2(pr(t, tNewest, 0.3)));
        }

        // ======================= leaders between figures =======================
        const tFlow = at(9, "速");
        const LEAD = [
          { d: "M 1840 990 L 1990 990 L 2030 950 L 2030 420 L 2070 380 L 2400 380", a: at(2, "token", 2) + 0.25, b: rowT(0) - 0.1, label: "→ 图 2", lx: 1850, ly: 976 },
          { d: "M 3880 960 L 3990 960 L 4030 920 L 4030 400 L 4070 360 L 4330 360", a: at(3, "慢") + 0.4, b: tKV, label: "→ 图 3", lx: 3880, ly: 946 },
          { d: "M 5560 860 L 5560 1150 L 4170 1150 L 4130 1190 L 4130 1950 L 4170 1990 L 4330 1990", a: tLook + 0.35, b: at(6, "代"), label: "↓ 图 4", lx: 5590, ly: 1110 },
          { d: "M 4380 2270 L 4060 2270 L 4020 2230 L 3910 2230", a: tGB + 0.35, b: at(8, "所"), label: "← 图 5", lx: 4060, ly: 2256 },
        ].map((o) => { o.sparks = SP; o.flow = tFlow; return Kit.leader($("leaders"), o); });

        // ======================= camera: a 2.5D crane over the sheet, keyed to the story =======================
        const CAM = Kit.camera($("world"), [
          [0.0, 964, 470, 1.04, 7, 0], [at(1, "是"), 964, 490, 1.03, 6, 0], [at(1, "蹦") + 0.4, 964, 512, 1.015, 5, 0],
          [tBack - 0.1, 964, 520, 1.0, 5, 0], [tAll, 955, 522, 1.0, 5, 0], [at(2, "token", 2) + 0.2, 960, 520, 1.0, 5, 0],
          [at(2, "token", 2) + 0.55, 2000, 560, 0.8, 14, -1.2], [rowT(0) - 0.05, 3060, 540, 1.0, 6, 0], [tSlow, 3070, 545, 1.01, 5, 0],
          [at(3, "慢") + 0.45, 3060, 545, 1.0, 5, 0], [tKV - 0.3, 4100, 580, 0.82, 13, 1.0], [tKV + 0.1, 5160, 536, 1.0, 6, 0],
          [at(5, "之"), 5170, 540, 1.02, 5, 0], [tNew, 5175, 540, 1.02, 5, 0], [tLook + 0.3, 5180, 544, 1.025, 5, 0],
          [tLook + 0.7, 5000, 1200, 0.84, 15, -1], [at(6, "代") + 0.2, 5160, 1856, 1.0, 6, 0], [tBill, 5130, 1860, 1.02, 5, 0],
          [tGB + 0.35, 5165, 1862, 1.01, 5, 0], [at(8, "所") - 0.5, 4100, 1840, 0.82, 14, 1.2], [at(8, "所") - 0.05, 3050, 1856, 1.0, 6, 0],
          [tV + 0.1, 3055, 1856, 1.0, 5, 0], [tPA, 3060, 1856, 1.0, 5, 0], [tAlloc + 0.05, 3064, 1856, 1.0, 5, 0],
          [tQ, 3066, 1856, 1.0, 5, 0], [tSq + 0.35, 3070, 1856, 1.0, 5, 0], [END + 0.4, 3100, 1500, 0.42, 20, -1.5],
          [END + 1.2, 3150, 1450, 0.3, 25, -2], [story.recap.start, 3140, 1430, 0.282, 27, -2.4], [story.duration, 3130, 1420, 0.27, 28, -2.7],
        ]);
        const chap = new CX.Chapters($("chap"), story);
        const FX = Kit.frame($("fx"));
        const recap = Kit.recap(story, { titleBlock: [["标题", "用显存换速度，只算新的那一个"], ["绘制", "模型"], ["审核", "你"], ["张", "1 / 1"], ["版本", "A"]] });
        $("recapwrap").appendChild(recap.el);
        const FIGS = [[0, 1], [rowT(0) - 0.4, 2], [tKV - 0.2, 3], [at(6, "代") - 0.1, 4], [at(8, "所") - 0.3, 5], [END + 0.6, 0]];
        function hud(t) {
          let f = 1;
          FIGS.forEach(([a, n]) => { if (t >= a) f = n; });
          const s = t >= story.recap.start ? "SHEET 1 / 1 · 说明" : f === 0 ? "SHEET 1 / 1 · 全图" : "SHEET 1 / 1 · 图 " + f + " / 5";
          U.setText(FX.sheetno, s);
        }

        function frame(t) {
          const covered = recap.covered(t);
          const disp = covered ? "none" : "";
          if ($("world").style.display !== disp) { $("world").style.display = disp; $("endwrap").style.display = disp; }
          recap.render(t);
          chap.render(t);
          hud(t);
          if (covered) return;
          CAM.render(t);
          R.forEach((f) => f(t));
          fig1(t);
          fig2(t);
          fig3(t);
          fig4(t);
          fig5(t);
          fig6(t);
          LEAD.forEach((L) => L.render(t));
          SP.render(t);
        }
        frame(0);
        const drive = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(drive, { t: story.duration, duration: story.duration, ease: "none", onUpdate: () => frame(tl.time()) }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
