          gongyong: S.phrase(8, "共用"),
          paged: S.at(8, "PagedAttention"),
          anye: S.phrase(8, "按页分配"),
          pei: S.at(8, "配"),
          lh: S.phrase(8, "量化"),

        const CLOSE = CH[CH.length - 1].end; // the closing line takes over (no chip)
        const SEAMS = CH.slice(1).map((c) => c.start).concat([CLOSE, T.R0]);

        // ================= tiny DOM / style helpers (every write is cached) =================
        function mk(tag, cls, parent, style, html) {
          const n = document.createElement(tag);
          if (cls) n.className = cls;
          if (style) n.style.cssText = style;
          if (html != null) n.innerHTML = html;
          if (parent) parent.appendChild(n);
          return n;
        }
        function css(el, p, v) {
          const k = "_c_" + p;
          if (el[k] !== v) {
            el.style[p] = v;
            el[k] = v;
          }
        }
        function op(el, o) {
          o = clamp01(o);
          css(el, "opacity", o.toFixed(3));
          css(el, "visibility", o > 0.001 ? "visible" : "hidden");
          return o;
        }
        function mv(el, x, y, s, sx) {
          let v = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
          if (s != null && s !== 1) v += ` scale(${s.toFixed(3)})`;
          if (sx != null) v += ` scaleX(${sx.toFixed(3)})`;
          css(el, "transform", v);
        }
        function cls(el, c, on) {
          if (!!el["_k" + c] !== !!on) {
            el.classList.toggle(c, !!on);
            el["_k" + c] = !!on;
          }
        }
        const NS = "http://www.w3.org/2000/svg";
        function sv(tag, attrs, parent) {
          const n = document.createElementNS(NS, tag);
          for (const a in attrs) n.setAttribute(a, attrs[a]);
          if (parent) parent.appendChild(n);
          return n;
        }
        const u3 = (t, a, d) => E.o3(pr(t, a, d));
        const io = (t, a, d) => E.io2(pr(t, a, d));
        const win = (t, a, b, fi = 0.25, fo = 0.25) => core.env(t, a, b, fi, fo);
        // a polyline with packets riding it (for the data bus)
        function polyAt(pts, q) {
          let L = 0;
          const seg = [];
          for (let i = 1; i < pts.length; i++) {
            const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
            seg.push(d);
            L += d;
          }
          let r = q * L;
          for (let i = 0; i < seg.length; i++) {
            if (r <= seg[i] || i === seg.length - 1) {
              const u = seg[i] ? Math.min(1, r / seg[i]) : 0;
              return [lerp(pts[i][0], pts[i + 1][0], u), lerp(pts[i][1], pts[i + 1][1], u)];
            }
            r -= seg[i];
          }
          return pts[pts.length - 1];

        const ZA = $("zA"),

        const SX = (k) => 420 + k * 150,
          TOKY = 280,
          PORT = { x: 382, y: 280 };
        // prompt
        const prompt = mk("div", "abs", ZA, "left:180px;top:136px;width:900px;height:86px");
        const promptPan = K.panel(prompt, 900, 86, 14, { stroke: "#4a5d73" });
        mk("div", "tex abs", prompt, "left:auto;right:26px;top:34px", "PROMPT");
        const promptTxt = mk("div", "abs", prompt, "left:28px;top:16px;font:500 40px/1.3 'Noto Sans SC';white-space:nowrap");

        for (let i = 0; i < 10; i++) mbars.push(mk("i", "abs", model, `left:${22 + i * 16}px;top:auto;bottom:16px;width:11px;height:4px;background:#c8ff3e`));

        // each new token is fired from the model's port along a rail above the row, into its slot
        const emit = mk("div", "abs", ZA, "width:34px;height:8px;background:#c8ff3e;box-shadow:0 0 14px rgba(200,255,62,.8)");
        // tokens + the pending slot (its bar fills while the next token is being computed)
        const toks = TOK.map((w) => {
          const el = mk("div", "tok abs", ZA);
          el.txt = mk("span", null, el);

        });
        const ghost = mk("div", "ghost abs", ZA);
        const ghostBar = mk("i", null, ghost);
        // beat 2: look-back arcs below the row
        const arcSvg = sv("svg", { class: "svgl", viewBox: "0 0 1920 1080" }, ZA);
        const lookScan = mk("div", "abs", ZA, "width:4px;height:96px;background:#c8ff3e;box-shadow:0 0 18px 4px rgba(200,255,62,.55)");
        const arcs = [0, 1, 2].map((j) => {
          const xa = SX(3) + 68,
            xb = SX(j) + 68,
            y = TOKY + 76,
            dep = 46 + (3 - j) * 30;
          const pts = [{ x: xa, y }, { x: xa - 30, y: y + dep }, { x: xb + 30, y: y + dep }, { x: xb, y }];
          const p = sv("path", { d: K.pathD(pts), fill: "none", stroke: "#c8ff3e", "stroke-width": 3 }, arcSvg);
          const L = K.blen(pts) + 4;
          p.style.strokeDasharray = `${L} ${L}`;
          const dot = sv("circle", { r: 7, fill: "#c8ff3e", cx: 0, cy: 0 }, arcSvg);
          return { j, pts, p, L, dot };
        });
        // beat 3: the recompute triangle (row n = step n recomputes the K/V of tokens 1..n)
        const ROWS = [];
        for (let n = 1; n <= 7; n++) {
          let b, d;

          laneK.render(t, T.kv + 0.35);

          KVP.forEach((p, i) => {
            const y = lerp(RY[0] + 2 + i * 50, RY[0] + 77, mg);
            const a = ROWIN[0] + 0.08 + i * 0.04;
            op(p, t >= a ? (i === 1 ? 1 : 1 - pr(mg, 0.15, 0.55)) * u3(t, a, 0.18) : 0);
            mv(p, 1060, y);
            const pts = K.link({ x: 800, y: RY[0] + 24 + i * 50 }, { x: 1060, y: y + 22 });
            const path = gqaLines[i];
            path.setAttribute("d", K.pathD(pts));
            const L = K.blen(pts) + 4;
            const dr = io(t, a + 0.06, 0.25);
            path.style.strokeDasharray = `${L.toFixed(1)} ${L.toFixed(1)}`;
            path.style.strokeDashoffset = ((1 - dr) * L).toFixed(1);
            path.style.opacity = dr > 0 ? "1" : "0";
            const live = t >= T.gongyong + 0.35;
            gqaDots[i].forEach((dot, j) => {
              if (!live) return void (dot.style.opacity = "0");
              const q = ((t - T.gongyong - 0.35) * 1.3 + j * 0.5 + i * 0.13) % 1;
              const pt = K.bez(pts, q);
              dot.setAttribute("cx", pt.x.toFixed(1));
              dot.setAttribute("cy", pt.y.toFixed(1));
              dot.style.opacity = Math.min(1, Math.sin(q * Math.PI) * 2).toFixed(3);
            });
          });
          gqaBars.render(t, [pr(t, ROWIN[0] + 0.1, 0.35), t >= T.gongyong + 0.25 ? pr(t, T.gongyong + 0.25, 0.4) : -1], t >= ROWIN[0] ? 1 : 0);
          // PagedAttention: the reserved block with its empty tail → pages, one more on demand
          const pz = io(t, T.anye, 0.35);
          op(resv, t >= ROWIN[1] ? u3(t, ROWIN[1], 0.2) * (1 - pz) : 0);
          // tokens keep arriving: page 3 fills up, and only when it is full is page 4 allocated, which starts filling
          const fill3 = lerp(0.45, 1, pr(t, T.anye + 0.3, T.pei - 0.1 - (T.anye + 0.3)));
          const fill4 = 0.8 * pr(t, T.pei - 0.05, 0.9);
          PAGES.forEach((p, i) => {
            if (t < T.anye) return void op(p, 0);
            const f = i < 2 ? 1 : i === 2 ? fill3 : i === 3 ? fill4 : 0;
            css(p.fill, "transform", `scaleX(${f.toFixed(3)})`);
            if (i < 3) return void op(p, pz);
            if (i === 3) {
              const need = u3(t, T.pei - 0.1, 0.25);
              cls(p, "e", need < 1);
              return void op(p, pz * (0.5 + 0.5 * need));
            }
            op(p, pz * (1 - pr(t, T.anye + 0.35, 0.3)) * 0.8);
          });
          op(pageNote, t >= T.anye + 0.2 ? u3(t, T.anye + 0.2, 0.25) : 0);
          pagedBars.render(t, [pr(t, ROWIN[1] + 0.1, 0.35), t >= T.anye + 0.25 ? pr(t, T.anye + 0.25, 0.4) : -1], t >= ROWIN[1] ? 1 : 0);
          // quantization: each cell halves (16 bit → 8 bit)
          const qz = io(t, T.lh + 0.1, 0.45);
          QCELL.forEach((c, i) => {
            op(c, t >= ROWIN[2] + i * 0.04 ? u3(t, ROWIN[2] + i * 0.04, 0.16) : 0);
            mv(c, lerp(0, -i * 70, qz), 0, 1, 1 - 0.5 * qz);
          });
          op(qLab, t >= ROWIN[2] ? 1 : 0);
          K.put(qLab, qz >= 0.5 ? K.dec("INT8 · 8 bit", t, T.lh + 0.32, 0.25, 41) : "FP16 · 16 bit");
          css(qLab, "color", qz >= 0.5 ? "#c8ff3e" : "#6cb6ff");
          op(quantNote, t >= T.lh + 0.25 ? u3(t, T.lh + 0.25, 0.25) : 0);
          quantBars.render(t, [pr(t, ROWIN[2] + 0.1, 0.3), t >= T.ys ? pr(t, T.ys, 0.4) : -1], t >= ROWIN[2] ? 1 : 0);
        }

        // ================= zone D: memory ⇄ speed; the newest token in the spotlight =================
        function zoneD(t) {
          TITLE.render(t);
          GZ.forEach((g) => {
            op(g.el, t >= CLOSE ? u3(t, CLOSE + 0.1, 0.25) : 0);
            css(g.fill, "transform", `scaleY(${(u3(t, g.at, 0.55) * 0.86).toFixed(3)})`);
            g.lab.render(t, g.at);
          });
          xWire.render(t, K.link({ x: 1550, y: 420 }, { x: 1690, y: 420 }, 40), { draw: io(t, T.huan - 0.1, 0.25), live: t >= T.huan, t0: T.huan, speed: 90, rate: 1.4, op: t >= T.huan - 0.1 ? 1 : 0 });
          xLab.render(t);
          const sp = t >= T.zsx;
          dTok.forEach((el, k) => {
            const a = CLOSE + 0.2 + k * 0.05;
            op(el, t >= a ? u3(t, a, 0.2) * (sp && k < 7 ? 1 - 0.55 * u3(t, T.zsx, 0.3) : 1) : 0);
            cls(el, "hl", k === 7 && t >= T.xin9);
          });
          dK.forEach((el, k) => {
            const a = CLOSE + 0.3 + k * 0.05;
            op(el, t >= a ? u3(t, a, 0.2) * (k === 7 ? (t >= T.xin9 ? 1 : 0.25) : 0.75) : 0);
          });
          dTrk.render(t, T.xin9);
          dCached.render(t);
          dNew.render(t);
          dBars.render(t, [pr(t, T.zsx + 0.1, 0.5), pr(t, T.xin9, 0.4)], t >= T.zsx + 0.1 ? u3(t, T.zsx + 0.1, 0.2) : 0);
        }

        function frame(t) {
          camera(t);
          GL.render(t);
          HUD.render(t);
          CHAP.render(t);
          CAPS.render(t);
          NOTES.forEach((n) => n.render(t));
          zoneA(t);
          zoneB(t);
          zoneC(t);
          zoneD(t);
          op(WORLD, t < T.R0 ? 1 : 0);
          RECAP.render(t);
        }

        const drive = { t: 0 };
        tl.fromTo(drive, { t: 0 }, { t: S.duration, duration: S.duration, ease: "none", onUpdate: () => frame(tl.time()) }, 0);
        frame(0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
